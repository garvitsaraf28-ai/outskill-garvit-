# Push the Inside Sales Apps Script project to Google, on every commit.
#
# WHAT THIS REPLACES
#
#   Pasting files into the Apps Script editor by hand, one at a time. That
#   is how a project ends up with two copies of canonBatch_ and nobody able
#   to say which one is live. With this, GitHub is the only source of truth
#   and the editor is a read-only view of it.
#
# IT IS OFF UNTIL YOU TURN IT ON
#
#   With neither secret set the job reports a notice and stops. It does not
#   fail, because a red cross on every push for a feature nobody asked for
#   yet is just noise. Set both secrets and it starts working; set only one
#   and it fails loudly, because half-configured is a real mistake.
#
# WHAT IT DOES, ONCE CONFIGURED
#
#   Runs `clasp push --force`, which makes the Apps Script project match
#   inside-sales/src EXACTLY.
#
#   --force means files in the project that are NOT in src/ are DELETED.
#   That is the point - it is what stops a stale file surviving - but it
#   also means the editor is not a place to make edits. Anything typed
#   there is gone on the next push. Edit here, commit, done.
#
# SETUP - see inside-sales/README.md for the walkthrough
#
#   Settings > Secrets and variables > Actions > New repository secret
#
#     CLASPRC_JSON   the whole contents of ~/.clasprc.json after `clasp login`
#     SCRIPT_ID      Apps Script > Project Settings > Script ID
#
# SAFETY
#
#   Nothing here can touch the Payment Tracker or CBC. clasp only writes
#   code into one Apps Script project, named by SCRIPT_ID. It has no access
#   to any spreadsheet.

name: Deploy Apps Script

on:
  push:
    branches:
      - claude/elegant-allen-Oq8U7
      - claude/data-architecture-protocol-wymh4n
    paths:
      - 'inside-sales/**'
      - '.github/workflows/deploy-apps-script.yml'
  workflow_dispatch:

concurrency:
  # Two pushes landing together must not race each other into the same
  # project - the second would overwrite the first half way through.
  group: apps-script-deploy
  cancel-in-progress: false

jobs:
  push:
    name: clasp push
    runs-on: ubuntu-latest

    steps:
      - name: Is the sync configured?
        id: cfg
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
        run: |
          have=0
          [ -n "$CLASPRC_JSON" ] && have=$((have+1))
          [ -n "$SCRIPT_ID" ]    && have=$((have+1))

          if [ "$have" -eq 0 ]; then
            echo "ready=no" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub -> Apps Script sync is not set up yet, so there is nothing to push. Add the CLASPRC_JSON and SCRIPT_ID secrets when you want it - inside-sales/README.md has the steps. Skipping, not failing."
            exit 0
          fi

          if [ "$have" -eq 1 ]; then
            echo "::error::Half configured - one of CLASPRC_JSON / SCRIPT_ID is set and the other is not. Set both, or neither."
            exit 1
          fi

          echo "ready=yes" >> "$GITHUB_OUTPUT"
          echo "Both secrets present."

      - name: Check out the repo
        if: steps.cfg.outputs.ready == 'yes'
        uses: actions/checkout@v4

      - name: Set up Node
        if: steps.cfg.outputs.ready == 'yes'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install clasp
        if: steps.cfg.outputs.ready == 'yes'
        run: npm install -g @google/clasp@2

      - name: Write the Google credentials
        if: steps.cfg.outputs.ready == 'yes'
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          # Prove it is JSON before clasp fails on it with a worse message.
          node -e "JSON.parse(require('fs').readFileSync(process.env.HOME + '/.clasprc.json','utf8'))" \
            || { echo "::error::CLASPRC_JSON is not valid JSON. Re-copy the WHOLE of ~/.clasprc.json, including the outer braces."; exit 1; }

      - name: Point clasp at the project
        if: steps.cfg.outputs.ready == 'yes'
        env:
          SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
        run: |
          cat > inside-sales/.clasp.json <<EOF
          {
            "scriptId": "$SCRIPT_ID",
            "rootDir": "src"
          }
          EOF
          echo "Files to push:"
          ls -la inside-sales/src/

      - name: Push to Apps Script
        if: steps.cfg.outputs.ready == 'yes'
        working-directory: inside-sales
        run: |
          set +e
          out=$(clasp push --force 2>&1)
          code=$?
          echo "$out"
          if [ $code -ne 0 ]; then
            echo ""
            if echo "$out" | grep -qi "User has not enabled the Apps Script API"; then
              echo "::error::The Apps Script API is off for this Google account."
              echo "Turn it on at https://script.google.com/home/usersettings and re-run."
            elif echo "$out" | grep -qi "invalid_grant\|Token has been expired\|unauthorized"; then
              echo "::error::The stored credentials have expired."
              echo "Run 'clasp login' again locally and update the CLASPRC_JSON secret."
            elif echo "$out" | grep -qi "Script ID\|not found\|404"; then
              echo "::error::That SCRIPT_ID was not found, or this account cannot open it."
              echo "Check Apps Script > Project Settings > Script ID."
            fi
            exit $code
          fi
          echo ""
          echo "The Apps Script project now matches inside-sales/src."
          echo ""
          echo "Code is live in the editor immediately. The WEB APP is not - a"
          echo "deployment is pinned to a version, so the leaderboard keeps serving"
          echo "the old code until you deploy a new version by hand:"
          echo "Deploy > Manage deployments > pencil > Version: New version."
