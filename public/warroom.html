<title>Sales Dangal</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@700&display=swap" rel="stylesheet">

<style>
/* =====================================================================
   SALES DANGAL - a single live screen, built like a news channel.

   The old board was eleven slides on a 13 second rotation. On a wall that
   meant any given number was visible for 13 seconds in every 143, most of
   the screen was empty most of the time, and nobody could answer "how is
   Hyderabad doing" without waiting. This replaces it with one screen where
   everything is present at once and only the EMPHASIS moves.
   ===================================================================== */

:root{
  /* Outskill's own tokens, taken from programs.html and
     accelerator-india.html so the wall matches everything else the team
     already looks at. Lime is the brand's, and it earns its place here by
     also being the natural colour for "ahead of pace". */
  --bg:#070905; --ink:#f0f4e8; --dim:#818f6c; --line:#1c2416;
  --lime:#c2ee45; --lime-dim:#a8d930; --teal:#4dd8c0;
  --gold:#ffd76e; --amber:#e8b24b; --rose:#ff6b8a; --violet:#b39bff;
  --mint:var(--lime); --sky:var(--teal);        /* old names, one source */
  --panel:rgba(16,21,12,.84);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink); overflow:hidden;
  font-family:'Space Grotesk',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
/* Fixed to the viewport rather than centred by body height. A host page
   that gives body no height - an Apps Script iframe, for one - would
   otherwise collapse the centring and strand the stage in the corner. */
#wrap{
  position:fixed; inset:0; overflow:hidden;
  display:flex; align-items:center; justify-content:center;
}

/* The stage is a fixed 1920x1080 canvas scaled to whatever screen it lands
   on. flex:none is load-bearing - without it the flex parent squeezes the
   stage to the viewport width and it gets scaled twice. */
#stage{
  width:1920px; height:1080px; flex:none; position:relative; overflow:hidden;
  transform-origin:center center;
  display:flex; flex-direction:column;
  background:
    radial-gradient(1200px 700px at 12% -10%, rgba(194,238,69,.09), transparent 60%),
    radial-gradient(1000px 600px at 88% 110%, rgba(77,216,192,.09), transparent 60%),
    var(--bg);
}
/* slow drifting light, GPU only, so it costs nothing over months of uptime */
#stage::before{
  content:''; position:absolute; inset:-25%; pointer-events:none; z-index:0;
  background:
    radial-gradient(520px 520px at 20% 30%, rgba(194,238,69,.10), transparent 60%),
    radial-gradient(620px 620px at 78% 62%, rgba(77,216,192,.09), transparent 60%),
    radial-gradient(480px 480px at 50% 88%, rgba(232,178,75,.07), transparent 60%);
  animation:arena 54s ease-in-out infinite alternate;
}
@keyframes arena{
  0%  {transform:translate3d(-2%,-1%,0) scale(1)}
  50% {transform:translate3d(2%,2%,0) scale(1.06)}
  100%{transform:translate3d(-1%,1%,0) scale(1.02)}
}
#stage > *{position:relative; z-index:1}

/* ------------------------------- TOP BAR ---------------------------- */
#top{
  height:112px; flex:none; display:flex; align-items:center; gap:26px;
  padding:0 26px; border-bottom:2px solid var(--line);
  background:linear-gradient(180deg, rgba(10,14,7,.95), rgba(10,14,7,.6));
}
#brand{display:flex; flex-direction:column; line-height:1; flex:none}
#brand b{
  font-family:Fraunces,Georgia,serif; font-weight:700; font-size:40px; letter-spacing:-.01em;
  background:linear-gradient(92deg,var(--lime),var(--teal) 70%,var(--teal));
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
#brand span{font-size:13px; color:var(--dim); letter-spacing:.34em; margin-top:6px; font-weight:700}

.hero{display:flex; align-items:baseline; gap:14px; flex:none}
.hero .v{font-family:'Space Grotesk',system-ui,sans-serif; font-weight:700; font-size:58px; letter-spacing:.01em; line-height:1}
.hero .k{font-size:12px; color:var(--dim); letter-spacing:.2em; font-weight:800; text-transform:uppercase}
.sep{width:2px; height:52px; background:var(--line); flex:none}

/* the company attainment bar, with a marker for where the month should be */
#coBar{flex:1 1 auto; min-width:260px}
#coBar .top{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:7px}
#coBar .lab{font-size:12px; color:var(--dim); letter-spacing:.2em; font-weight:800}
#coBar .val{font-size:22px; font-weight:900; font-variant-numeric:tabular-nums}
.track{position:relative; height:16px; border-radius:9px; background:#141a0e; overflow:visible}
.track > i{
  position:absolute; left:0; top:0; bottom:0; border-radius:9px; display:block;
  background:linear-gradient(90deg,var(--teal),var(--lime));
  transition:width 1.1s cubic-bezier(.22,1,.36,1);
}
.track > u{                       /* the pace marker - where we SHOULD be */
  position:absolute; top:-5px; bottom:-5px; width:3px; background:var(--gold);
  border-radius:2px; box-shadow:0 0 10px rgba(255,215,110,.85);
}
.track.behind > i{background:linear-gradient(90deg,var(--amber),var(--rose))}

#live{display:flex; align-items:center; gap:10px; flex:none; font-size:15px; color:var(--dim); font-weight:700}
#live .dot{width:12px; height:12px; border-radius:50%; background:var(--mint); box-shadow:0 0 14px var(--mint); animation:pulse 2s infinite}
#live.stale .dot{background:var(--gold); box-shadow:0 0 14px var(--gold)}
#live.down  .dot{background:var(--rose); box-shadow:0 0 14px var(--rose)}
#live b{color:var(--ink)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ------------------------------- BODY ------------------------------- */
#body{flex:1 1 auto; display:flex; gap:16px; padding:16px 26px; min-height:0}

/* ---- left rail: a vertical stat ticker that never stops moving ---- */
#rail{
  width:352px; flex:none; border:1px solid var(--line); border-radius:16px;
  background:var(--panel); overflow:hidden; display:flex; flex-direction:column;
}
#rail .hd{
  padding:13px 18px; border-bottom:1px solid var(--line); flex:none;
  font-size:12px; letter-spacing:.24em; color:var(--dim); font-weight:800;
  display:flex; justify-content:space-between; align-items:center;
}
#rail .hd em{font-style:normal; color:var(--gold)}
/* The rail is a fixed-height window over a taller list, so whatever tile
   straddles the bottom edge gets sliced. Fading both edges makes that read
   as a list continuing rather than as a clipped panel. */
#railView{
  flex:1 1 auto; overflow:hidden; position:relative;
  -webkit-mask-image:linear-gradient(180deg, transparent 0, #000 22px,
                     #000 calc(100% - 34px), transparent 100%);
  mask-image:linear-gradient(180deg, transparent 0, #000 22px,
             #000 calc(100% - 34px), transparent 100%);
}
#railTrack{position:absolute; left:0; right:0; top:0; transition:transform .9s cubic-bezier(.22,1,.36,1)}
.stat{
  height:104px; padding:0 18px; display:flex; flex-direction:column; justify-content:center;
  gap:7px; border-bottom:1px solid rgba(28,36,22,.75);
}
.stat .k{font-size:12px; letter-spacing:.16em; color:var(--dim); font-weight:800; text-transform:uppercase;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.stat .r{display:flex; align-items:baseline; gap:10px}
/* the figure never wraps; the label beside it gives way instead */
.stat .v{font-family:'Space Grotesk',system-ui,sans-serif; font-weight:700; font-size:34px;
  line-height:1; flex:none; white-space:nowrap}
.stat .u{font-size:14px; color:var(--dim); font-weight:700; flex:1 1 auto; min-width:0;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.stat .p{margin-left:auto; font-size:17px; font-weight:900; font-variant-numeric:tabular-nums}
.stat.ahead .p{color:var(--mint)} .stat.behind .p{color:var(--rose)} .stat.flat .p{color:var(--gold)}
.stat .mini{height:6px; border-radius:4px; background:#141a0e; overflow:hidden; position:relative}
.stat .mini i{position:absolute; left:0; top:0; bottom:0; border-radius:4px; background:var(--sky)}
.stat.ahead .mini i{background:var(--mint)} .stat.behind .mini i{background:var(--rose)}

/* ---- the four blocks ---- */
#arena{flex:1 1 auto; position:relative; min-width:0}
.blk{
  position:absolute; border:1px solid var(--line); border-radius:16px;
  background:var(--panel); overflow:hidden; display:flex; flex-direction:column;
  transition:left .95s cubic-bezier(.22,1,.36,1), top .95s cubic-bezier(.22,1,.36,1),
             width .95s cubic-bezier(.22,1,.36,1), height .95s cubic-bezier(.22,1,.36,1),
             border-color .5s, box-shadow .5s;
  will-change:left,top,width,height;
}
.blk.big{border-color:rgba(194,238,69,.38); box-shadow:0 0 0 1px rgba(194,238,69,.14), 0 26px 70px rgba(0,0,0,.6)}
.blk .hd{
  flex:none; padding:14px 18px; border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:12px;
}
.blk .hd h3{
  margin:0; font-family:'Space Grotesk',system-ui,sans-serif; font-weight:700;
  font-size:22px; letter-spacing:.14em; text-transform:uppercase; white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis;
}
.blk.big .hd h3{font-size:31px; color:var(--gold)}
.blk .hd .sub{margin-left:auto; font-size:12px; color:var(--dim); font-weight:700;
  letter-spacing:.12em; white-space:nowrap; text-transform:uppercase}
.blk.sm .hd .sub{display:none}
.blk .bd{flex:1 1 auto; padding:8px 18px 14px; overflow:hidden; display:flex; flex-direction:column}

/* one comparison row: rank, name, bar, figure */
.row{
  display:flex; align-items:center; gap:13px; padding:9px 0;
  border-bottom:1px solid rgba(28,36,22,.6); flex:1 1 auto; min-height:0;
}
.row:last-child{border-bottom:0}
.row .rk{
  width:34px; flex:none; text-align:center; font-family:'Space Grotesk',system-ui,sans-serif; font-weight:700;
  font-size:22px; color:var(--dim);
}
.row.p1 .rk{color:var(--gold)} .row.p2 .rk{color:#dfe6cf} .row.p3 .rk{color:var(--amber)}
.row .who{flex:1 1 auto; min-width:0}
.row .who b{display:block; font-size:19px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.row .who span{display:block; font-size:12px; color:var(--dim); font-weight:600; margin-top:2px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.blk.sm .row .who span{display:none}
.row .bar{width:210px; flex:none}
.blk.sm .row .bar{width:92px}
.row .fig{width:126px; flex:none; text-align:right}
.blk.sm .row .fig{width:88px}
.row .fig b{display:block; font-size:20px; font-weight:900; font-variant-numeric:tabular-nums}
.row .fig span{display:block; font-size:12px; color:var(--dim); font-weight:700; margin-top:2px}
.blk.sm .row .fig span{display:none}
.blk.big .row{padding:11px 0}
.blk.big .row .who b{font-size:23px}
.blk.big .row .rk{font-size:27px; width:40px}

/* A row with only three cities in it would otherwise be 286px of empty
   panel - the exact fault this redesign exists to fix. When a block is big
   its rows carry their own breakdown underneath, so the space is filled
   with more information rather than more air. */
.row.deep{flex-direction:column; align-items:stretch; gap:9px; justify-content:center}
.row.deep .lead{display:flex; align-items:center; gap:13px}
.row.deep .kids{display:flex; flex-direction:column; gap:5px; padding-left:53px}
.blk.sm .row.deep .kids{display:none}
.blk.sm .row.deep{flex-direction:row; align-items:center; gap:13px}
.kid{display:flex; align-items:center; gap:11px; font-size:15px}
.kid .kn{width:230px; flex:none; color:#d3dcc2; font-weight:700; white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis}
.kid .kn i{font-style:normal; color:var(--dim); font-weight:600; font-size:13px}
.kid .kb{flex:1 1 auto; min-width:0}
.kid .kv{width:66px; flex:none; text-align:right; font-weight:800; font-variant-numeric:tabular-nums}
.kid .kr{width:76px; flex:none; text-align:right; color:var(--dim); font-weight:700; font-size:13px}

/* small blocks show fewer rows - the detail belongs to whichever block is big */
.blk.sm .row:nth-child(n+5){display:none}

.pcttag{font-variant-numeric:tabular-nums}
.ahead{color:var(--mint)} .behind{color:var(--rose)} .flat{color:var(--gold)}

/* pace block */
.pacegrid{display:flex; flex-wrap:wrap; gap:12px; align-content:flex-start; padding-top:6px}
.pcard{
  flex:1 1 44%; min-width:0; border:1px solid var(--line); border-radius:12px; padding:13px 15px;
  background:rgba(9,13,6,.55);
}
.pcard .k{font-size:11px; letter-spacing:.16em; color:var(--dim); font-weight:800; text-transform:uppercase}
.pcard .v{font-family:'Space Grotesk',system-ui,sans-serif; font-weight:700; font-size:34px; margin-top:7px; line-height:1}
.pcard .n{font-size:12px; color:var(--dim); margin-top:6px; font-weight:600}
.blk.sm .pacegrid{gap:8px}
.blk.sm .pcard{flex:1 1 46%; padding:8px 10px}
.blk.sm .pcard .k{font-size:10px; letter-spacing:.1em}
.blk.sm .pcard .v{font-size:21px; margin-top:4px}
.blk.sm .pcard .n{display:none}
.blk.sm .pushlist, .blk.sm .citypace{display:none}
.citypace{margin-top:8px; border-top:1px solid var(--line); padding-top:8px}
.pl-h{font-size:11px; letter-spacing:.16em; color:var(--dim); font-weight:800;
  text-transform:uppercase; margin-bottom:8px}
.pl-r{display:flex; align-items:baseline; gap:12px; padding:3px 0; font-size:16px}
.pl-r b{flex:none; max-width:280px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.pl-m{flex:1 1 auto; color:var(--dim); font-size:13px; font-weight:600;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.pl-v{flex:none; color:var(--rose); font-weight:800}

/* ------------------------------ TICKER ------------------------------ */
#tick{
  height:78px; flex:none; border-top:2px solid var(--line); display:flex; align-items:stretch;
  background:linear-gradient(180deg, rgba(10,14,7,.7), rgba(10,14,7,.96)); overflow:hidden;
}
#tickLab{
  flex:none; width:228px; display:flex; align-items:center; justify-content:center; gap:10px;
  background:linear-gradient(92deg,var(--lime),var(--teal));
  font-family:'Space Grotesk',system-ui,sans-serif; font-weight:700; font-size:20px;
  letter-spacing:.13em; text-transform:uppercase; color:#0a1004; white-space:nowrap;
}
#tickLab i{width:11px; height:11px; border-radius:50%; background:#0a1004; animation:pulse 1.4s infinite; font-style:normal}
#tickView{flex:1 1 auto; overflow:hidden; display:flex; align-items:center; position:relative}
#tickTrack{display:inline-flex; white-space:nowrap; will-change:transform; animation:tick 64s linear infinite}
#tick:hover #tickTrack{animation-play-state:paused}
@keyframes tick{from{transform:translate3d(0,0,0)} to{transform:translate3d(-50%,0,0)}}
.ti{display:inline-flex; align-items:center; gap:13px; padding:0 34px; font-size:23px; flex:none}
.ti em{font-style:normal; color:var(--gold); font-weight:900; font-size:15px; letter-spacing:.14em}
.ti b{font-weight:800}
.ti .amt{font-family:Space Mono,monospace; font-weight:700; color:var(--mint)}
.ti .mt{color:var(--dim); font-size:15px; font-weight:600}
.ti .dv{color:var(--line)}

/* ---------------------------- STATE SCREEN -------------------------- */
#state{
  position:absolute; inset:0; z-index:40; display:none; align-items:center; justify-content:center;
  background:rgba(7,9,5,.97); padding:70px; text-align:center;
}
#state.on{display:flex}
#state .kicker{font-size:17px; letter-spacing:.3em; color:var(--rose); font-weight:800; text-transform:uppercase}
#state .line{font-family:'Space Grotesk',system-ui,sans-serif; font-weight:700; font-size:94px; margin:20px 0 26px; line-height:1}
#state .accent{color:var(--gold)}
#state .note{font-size:21px; color:var(--dim); line-height:1.6; max-width:1250px; margin:0 auto}
#state code{font-family:Space Mono,monospace; color:var(--sky); font-size:19px}
/* The freshness chip. Silent when the sheet is current; loud when it is
   not, because a board that is confidently a day out is worse than one
   that is obviously broken. */
#fresh{
  flex:none; display:none; align-items:center; justify-content:center; gap:10px;
  height:34px; font-size:14px; font-weight:800; letter-spacing:.14em; text-transform:uppercase;
}
/* In the flex flow rather than floating: a warning that covers a panel
   header is a second bug, not a louder warning. The body gives up 34px. */
#fresh.warn{display:flex; background:var(--rose); color:#1a0509;
  animation:nudge 2.6s ease-in-out infinite}
@keyframes nudge{0%,100%{opacity:1}50%{opacity:.62}}

/* A close that lands while the board is up should be seen landing - but in
   the bar that already exists for exactly this, not as a panel dropped over
   the numbers. The whole strip lifts for a few seconds instead. */
#tick.hot{box-shadow:inset 0 0 0 2px var(--lime), 0 -16px 46px rgba(194,238,69,.16)}
#tick.hot #tickLab{animation:hotlab .7s ease-in-out infinite alternate}
@keyframes hotlab{from{filter:brightness(1)} to{filter:brightness(1.35)}}
#hot{
  position:absolute; inset:0; display:none; align-items:center; gap:16px; padding-left:34px;
  background:linear-gradient(90deg, rgba(10,14,7,.98) 78%, rgba(10,14,7,0));
  font-size:26px; font-weight:800;
}
#hot.on{display:flex; animation:hotIn .45s cubic-bezier(.22,1,.36,1)}
#hot em{font-style:normal; font-size:13px; letter-spacing:.2em; color:var(--lime); font-weight:900}
#hot .amt{font-family:'Space Mono',monospace; color:var(--lime)}
#hot .mt{font-size:16px; color:var(--dim); font-weight:600}
@keyframes hotIn{from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:none}}

/* rank movement */
.mv{font-size:12px; font-weight:800; margin-left:7px}
.mv.up{color:var(--lime)} .mv.dn{color:var(--rose)} .mv.nu{color:var(--gold)}

/* the momentum chart */
.spark{display:flex; align-items:flex-end; gap:3px; height:104px; padding-top:4px}
.spark .bar{flex:1 1 auto; min-width:0; display:flex; flex-direction:column;
  justify-content:flex-end; height:100%; position:relative}
.spark .bar i{display:block; border-radius:3px 3px 0 0; background:var(--teal); opacity:.75;
  transition:height .8s cubic-bezier(.22,1,.36,1)}
.spark .bar.best i{background:var(--lime); opacity:1}
.spark .bar.today i{background:var(--gold); opacity:1}
.spark .bar.zero i{background:var(--line); opacity:1; min-height:2px}
.spark .bar b{position:absolute; bottom:-17px; left:0; right:0; text-align:center;
  font-size:9px; color:var(--dim); font-weight:700}
.sparkwrap{margin-top:8px; border-top:1px solid var(--line); padding-top:8px; padding-bottom:18px}
.blk.sm .sparkwrap{display:none}

/* A quiet signature, not a credit line. Deliberately the dimmest thing on
   the screen so it never competes with a number. */
#sig{
  position:absolute; top:7px; right:16px; z-index:20;
  font-size:11px; letter-spacing:.22em; color:var(--ink); opacity:.45;
  font-weight:500; text-transform:uppercase; pointer-events:none;
}
#banner{
  position:absolute; top:0; left:50%; transform:translateX(-50%); z-index:30;
  background:var(--lime); color:#0f1405; font-weight:900; font-size:14px; letter-spacing:.18em;
  padding:6px 26px; border-radius:0 0 12px 12px; display:none; text-transform:uppercase;
}
#banner.on{display:block}

/* entrance, once per repaint, cheap */
.row, .stat, .pcard{animation:liftIn .45s cubic-bezier(.22,1,.36,1) backwards}
@keyframes liftIn{from{opacity:0; transform:translateY(9px)} to{opacity:1; transform:none}}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important}
}
</style>

<div id="wrap">
<div id="stage">
  <div id="banner"></div>

  <div id="top">
    <div id="brand"><b>SALES DANGAL</b><span id="periodSmall">month to date</span></div>
    <div class="sep"></div>
    <div class="hero"><div><div class="k">Revenue</div><div class="v" id="coRev">—</div></div></div>
    <div class="hero"><div><div class="k">Units</div><div class="v" id="coUnits">—</div></div></div>
    <div class="sep"></div>
    <div id="coBar">
      <div class="top">
        <div class="lab">AGAINST TARGET <span id="coTgt" style="color:var(--dim)"></span></div>
        <div class="val" id="coPct">—</div>
      </div>
      <div class="track" id="coTrack"><i id="coFill" style="width:0%"></i><u id="coMark" style="left:0%"></u></div>
    </div>
    <div class="sep"></div>
    <div id="live"><span class="dot"></span><span id="livetext">connecting…</span></div>
  </div>
  <div id="sig">Garvit</div>

  <div id="fresh"></div>

  <div id="body">
    <div id="rail">
      <div class="hd"><span>THE NUMBERS</span><em id="railNow">—</em></div>
      <div id="railView"><div id="railTrack"></div></div>
    </div>
    <div id="arena">
      <div class="blk" id="b0"><div class="hd"><h3>City Race</h3><div class="sub"></div></div><div class="bd"></div></div>
      <div class="blk" id="b1"><div class="hd"><h3>Manager Race</h3><div class="sub"></div></div><div class="bd"></div></div>
      <div class="blk" id="b2"><div class="hd"><h3>Agent Arena</h3><div class="sub"></div></div><div class="bd"></div></div>
      <div class="blk" id="b3"><div class="hd"><h3>Pace</h3><div class="sub"></div></div><div class="bd"></div></div>
    </div>
  </div>

  <div id="tick">
    <div id="tickLab"><i></i><span>Just Closed</span></div>
    <div id="tickView"><div id="tickTrack"></div><div id="hot"></div></div>
  </div>

  <div id="state"></div>
</div>
</div>

<script>
/* =====================================================================
   CONFIG
   ===================================================================== */
var Q = new URLSearchParams(location.search);
var CONFIG = {
  API_URL: Q.get('api') ||
    'https://script.google.com/macros/s/AKfycbzKIf-nwL4RLwhwfhSQTMo-pyjEeonxxdTexUecEYdKOUnkBNIrlhqPJTPbII1iZcxe6g/exec?feed=warroom',
  REFRESH_SECONDS: +(Q.get('refresh') || 30),
  ROTATE_SECONDS:  +(Q.get('rotate')  || 32),   // how long each block stays big
  RAIL_SECONDS:    +(Q.get('rail')    || 4.5),  // how long each stat tile shows
  DEMO: Q.get('demo') === '1',
  /* Stretch to fill a screen that is not 16:9, instead of letterboxing.
     The stage is a fixed 1920x1080, so on anything wider or taller there
     are bands. &fill=1 scales the axes independently to remove them, at
     the cost of distorting everything slightly - on a 16:10 laptop that
     is about 2% and invisible; on something far from 16:9 it would show.
     Off by default because a leaderboard should not quietly stretch. */
  FILL: Q.get('fill') === '1'
};

/* =====================================================================
   STATE
   ===================================================================== */
var DATA = null, LAST_OK = 0, DATA_AT = 0, FAILS = 0, USING_SAMPLE = false;
var prevAgentRank = {}, lastSig = '';
var bigIdx = 0, rotTimer = null;
var railItems = [], railIdx = 0, railTimer = null;
var peerIdx = 0;                 // which city/segment group the Agent Arena shows
var running = false;

/* =====================================================================
   UTIL
   ===================================================================== */
function n(x){ if(typeof x==='string') x=x.replace(/,/g,''); x=Number(x); return isFinite(x)?x:0; }
function s(x){ return x==null?'':String(x); }
function money(v){ v=n(v); var a=Math.abs(v);
  if(a>=10000000) return (v/10000000).toFixed(2)+' cr';
  if(a>=100000)   return (v/100000).toFixed(2)+' L';
  return Math.round(v).toLocaleString('en-IN'); }
function moneyShort(v){ v=n(v); var a=Math.abs(v);
  if(a===0) return '0';
  if(a>=10000000) return (v/10000000).toFixed(2)+'cr';
  if(a<100000) return Math.round(v).toLocaleString('en-IN');
  return (v/100000).toFixed(1)+'L'; }
function pct(a,b){ b=n(b); return b>0 ? (n(a)/b)*100 : 0; }
function esc(x){ return String(x==null?'':x).replace(/[&<>"]/g,function(c){
  return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }
function joinDot(){ return Array.prototype.slice.call(arguments)
  .filter(function(v){return v!==''&&v!=null;}).join(' · '); }

/* Count a figure up to its new value. Cheap, cancellable, and it only
   runs when the number actually changed - a poll returning the same total
   should not make the wall twitch. */
function countUp(node, to, fmt, ms){
  if(!node) return;
  var from = node._val==null ? 0 : node._val;
  node._val = to;
  if(from===to){ node.textContent=fmt(to); return; }
  var t0=performance.now(); ms=ms||900;
  if(node._raf) cancelAnimationFrame(node._raf);
  function step(t){
    var p=Math.min((t-t0)/ms,1), e=1-Math.pow(1-p,3);
    node.textContent=fmt(from+(to-from)*e);
    if(p<1) node._raf=requestAnimationFrame(step); else node._raf=null;
  }
  node._raf=requestAnimationFrame(step);
}

/* THE COMPARISON RULE, IN ONE PLACE.

   Ranking by rupees is the wrong question on this floor. Managers carry
   targets from 34 L to 1.40 cr, and India and International sell at
   different prices, so "who billed most" mostly reports who was given the
   biggest number to chase. Attainment against own target is the only
   comparison where every row is answering the same question. */
function attain(x){ return pct(x.revenue, x.target); }
function byAttain(a,b){
  var pa=attain(a), pb=attain(b);
  if(pa>0||pb>0) return pb-pa || b.revenue-a.revenue;
  return b.revenue-a.revenue || b.units-a.units;     // no targets set: fall back
}
/* where the month SHOULD be by now, as a percentage */
function expectedPct(){
  var m = (DATA&&DATA.meta)||{}; var d=n(m.day), t=n(m.days);
  return (t>0 && d>0) ? Math.min(100,(d/t)*100) : 0;
}
function paceClass(p){
  var e=expectedPct(); if(!e) return 'flat';
  if(p >= e+4) return 'ahead'; if(p <= e-4) return 'behind'; return 'flat';
}

/* a comparison bar with the pace marker on it */
function barHTML(p){
  var cl = paceClass(p), e = expectedPct();
  return '<div class="track '+(cl==='behind'?'behind':'')+'" style="height:11px">'+
           '<i style="width:'+Math.max(0,Math.min(100,p)).toFixed(1)+'%"></i>'+
           (e? '<u style="left:'+e.toFixed(1)+'%"></u>':'')+
         '</div>';
}

/* =====================================================================
   STAGE SCALING
   ===================================================================== */
/* THE STAGE MUST RE-FIT WHENEVER THE WINDOW REALLY CHANGES SIZE.

   Relying on the resize event alone is not enough. Served inside an
   iframe - which is how Apps Script serves a page - the frame can be laid
   out small and grown afterwards without the inner window ever hearing a
   resize. The board then stays scaled for the size it first saw: a
   postage stamp in the corner with the blocks overlapping, which is
   exactly what happened.

   So: observe the element, and re-fit on a few delays after boot as a
   backstop where ResizeObserver is missing. Both are idempotent - fitting
   twice at the same size costs one style write and changes nothing. */
function fit(){
  var w = document.documentElement.clientWidth  || window.innerWidth  || 1920;
  var h = document.documentElement.clientHeight || window.innerHeight || 1080;
  var st = document.getElementById('stage');
  if (st) {
    if (CONFIG.FILL) {
      st.style.transform = 'scale(' + (w / 1920) + ',' + (h / 1080) + ')';
    } else {
      var k = Math.min(w / 1920, h / 1080);
      if (!(k > 0)) k = 1;
      st.style.transform = 'scale(' + k + ')';
    }
  }
  /* The blocks are positioned as percentages of a box whose size is only
     known after the fit, so they are placed again here. */
  if (running) layout();
}
window.addEventListener('resize', fit);
window.addEventListener('load', fit);
if (typeof ResizeObserver === 'function') {
  try { new ResizeObserver(fit).observe(document.documentElement); } catch (e) {}
}
[60, 250, 800, 2000].forEach(function(ms){ setTimeout(fit, ms); });
function goFull(){ var e=document.documentElement;
  if(document.fullscreenElement) document.exitFullscreen();
  else if(e.requestFullscreen) e.requestFullscreen().catch(function(){}); }
document.addEventListener('keydown', function(e){
  if(e.key==='f'||e.key==='F') goFull();
  if(e.key==='ArrowRight'){ clearTimeout(rotTimer); bigIdx=(bigIdx+1)%4; layout(); schedule(); }
  if(e.key==='ArrowLeft'){ clearTimeout(rotTimer); bigIdx=(bigIdx+3)%4; layout(); schedule(); }
});

/* =====================================================================
   DATA LAYER - JSONP, because an Apps Script Web App is not reliably
   CORS-fetchable cross-origin. A <script> tag always works.
   ===================================================================== */
var jsonpSeq = 0;
function loadData(){
  if(!CONFIG.API_URL){ stateScreen('not-configured'); return; }
  var cb='__wr'+(++jsonpSeq), done=false;
  var sc=document.createElement('script');
  var url=CONFIG.API_URL+(CONFIG.API_URL.indexOf('?')>-1?'&':'?')+'callback='+cb+'&t='+Date.now();
  /* A cold build walks every payment row. Most polls hit the feed cache and
     return instantly; the one that rebuilds gets as long as it needs. */
  var timer=setTimeout(function(){ if(!done){ cleanup(); fail(); } }, 90000);
  window[cb]=function(p){ done=true; clearTimeout(timer); cleanup();
    if(p&&p.ok) applyData(p); else fail(); };
  function cleanup(){ try{delete window[cb];}catch(e){window[cb]=undefined;}
    if(sc.parentNode) sc.parentNode.removeChild(sc); }
  sc.onerror=function(){ if(!done){ clearTimeout(timer); cleanup(); fail(); } };
  sc.src=url; document.head.appendChild(sc);
}

/* A board with no real data must SAY so. It must never fall back to
   plausible-looking numbers - a wrong figure read confidently off a wall is
   worse than an obviously broken screen, because nobody checks it. */
function fail(){
  FAILS++;
  if(!DATA){ stateScreen('unreachable'); return; }
  paintLive();                 // real figures stay up, labelled with their age
}

function stateScreen(kind){
  running=false; clearTimeout(rotTimer); clearInterval(railTimer);
  var body = (kind==='not-configured')
    ? { k:'Setup needed', line:'NO <span class="accent">FEED</span> CONNECTED',
        note:'Open this page with the Apps Script web app URL on the end:<br>'+
             '<code>?api=&lt;your /exec URL&gt;?feed=warroom</code>' }
    : /PASTE|YOUR_EXEC|[<>]|example\.com/i.test(CONFIG.API_URL)
    ? { k:'The placeholder was not replaced', line:'THAT IS NOT A <span class="accent">REAL URL</span>',
        note:'The address below is example text, not your web app. In Apps Script go to '+
             '<b>Deploy &rsaquo; Manage deployments</b>, copy the Web app URL ending in <b>/exec</b>, '+
             'and use that instead.<div style="margin-top:16px;font-family:Space Mono,monospace;'+
             'font-size:17px;color:var(--rose);word-break:break-all">'+esc(CONFIG.API_URL)+'</div>' }
    : { k:'Cannot reach the feed', line:'NO <span class="accent">DATA</span> YET',
        note:'<b>Click the address below.</b> What it shows names the fault: the Executive '+
             'Command Center means the routing line is missing from doGet; a Google sign-in '+
             'means access is not set to <b>Anyone</b>; "Script function not found" means the '+
             'deployment is pinned to an old version.'+
             '<div style="margin-top:16px"><a href="'+esc(CONFIG.API_URL)+'" target="_blank" '+
             'rel="noopener" style="font-family:Space Mono,monospace;font-size:17px;color:var(--gold);'+
             'word-break:break-all;text-decoration:underline">'+esc(CONFIG.API_URL)+'</a></div>'+
             '<div style="margin-top:12px;font-size:18px">'+
             (FAILS>0 ? ('No answer after '+FAILS+' attempt'+(FAILS===1?'':'s')+'. Retrying every ')
                      : 'Trying now, then every ')+
             Math.max(10,CONFIG.REFRESH_SECONDS)+' seconds.</div>' };
  var st=document.getElementById('state');
  st.className='on';
  st.innerHTML='<div><div class="kicker">'+body.k+'</div><div class="line">'+body.line+
               '</div><div class="note">'+body.note+'</div></div>';
  paintLive();
}

function applyData(p){
  if(DATA&&DATA.agents){ prevAgentRank={};
    DATA.agents.forEach(function(a,i){ prevAgentRank[a.name]=i+1; }); }
  DATA = normalise(p);
  USING_SAMPLE = !!p.sample;
  document.getElementById('state').className='';
  LAST_OK=Date.now(); FAILS=0;
  /* Show the age of the NUMBERS, not of the request. The feed caches, so a
     fetch that just succeeded can carry figures built minutes ago, and the
     one thing a leaderboard must not lie about is how current it is. */
  var built=n(DATA.meta&&DATA.meta.generatedAt), skew=Math.abs(Date.now()-built);
  DATA_AT = (built>0 && skew<86400000) ? built : LAST_OK;

  var b=document.getElementById('banner');
  b.className = USING_SAMPLE ? 'on' : '';
  b.textContent = USING_SAMPLE ? 'PREVIEW DATA' : '';

  paintTop(); buildRail(); buildTicker();
  flashNewSale();
  var sig=signature(DATA);
  if(!running){ running=true; lastSig=sig; layout(); renderAll(); schedule(); startRail(); return; }
  if(sig!==lastSig){ lastSig=sig; renderAll(); }
}

/* A sale that lands while the board is on the wall should be seen landing.
   Keyed on name+amount+timestamp of the newest close, so a repaint that
   carries the same figures never fires it twice. Silent on the very first
   payload - everything is "new" then, and a toast for a sale from three
   days ago would be a lie. */
var lastSaleKey=null;
function flashNewSale(){
  var r=(DATA.recent||[])[0];
  if(!r){ return; }
  var key=r.name+'|'+r.amt+'|'+r.at;
  if(lastSaleKey===null){ lastSaleKey=key; return; }   // first load: no toast
  if(key===lastSaleKey) return;
  lastSaleKey=key;
  var hot=document.getElementById('hot'), bar=document.getElementById('tick');
  if(!hot||!bar) return;
  hot.innerHTML='<em>JUST IN</em><b>'+esc(r.name)+'</b>'+
                '<span class="amt">'+money(r.amt)+'</span>'+
                '<span class="mt">'+esc(joinDot(r.city,r.team,r.manager))+'</span>';
  hot.className='on'; bar.className='hot';
  clearTimeout(hot._h);
  hot._h=setTimeout(function(){ hot.className=''; bar.className=''; }, 9000);
}

function signature(d){
  return [d.totals.revenue,d.totals.units,d.totals.target,d.cities.length,d.managers.length]
    .concat(d.agents.slice(0,60).map(function(a){return a.name+':'+a.revenue+':'+a.units;}))
    .concat((d.recent||[]).slice(0,10).map(function(r){return r.name+':'+r.amt;}))
    .join('|');
}

/* Tolerate missing sections, nulls, zero targets, bad rows. Everything is
   forced to a usable type once, here, so nothing below has to guard. */
function normalise(p){
  p=p||{};
  var out={
    meta:p.meta||{}, totals:p.totals||{},
    cities:(p.cities||[]).filter(function(c){return c&&c.name;}),
    managers:(p.managers||[]).filter(function(m){return m&&m.name;}),
    agents:(p.agents||[]).filter(function(a){return a&&a.name;}),
    recent:(p.recent||[]).filter(function(r){return r&&r.name;}),
    byDay:(p.byDay||[]).filter(function(d){return d&&d.d;}),
    contest:p.contest||{active:false}
  };
  function clean(x){
    x.name=s(x.name); x.manager=s(x.manager); x.city=s(x.city); x.team=s(x.team);
    x.revenue=n(x.revenue); x.units=n(x.units); x.target=n(x.target); x.agents=n(x.agents);
    return x;
  }
  out.cities.forEach(clean); out.managers.forEach(clean); out.agents.forEach(clean);
  out.recent.forEach(function(r){ r.name=s(r.name); r.city=s(r.city); r.team=s(r.team);
    r.manager=s(r.manager); r.amt=n(r.amt); r.at=n(r.at); });
  out.byDay.forEach(function(d){ d.d=n(d.d); d.rev=n(d.rev); d.units=n(d.units); });

  out.cities.sort(byAttain); out.managers.sort(byAttain);
  out.agents.sort(function(a,b){ return b.revenue-a.revenue || b.units-a.units; });
  out.agents.forEach(function(a,i){
    a.rank=i+1;
    var pr = a.prevRank!=null ? a.prevRank : prevAgentRank[a.name];
    a.move = (pr==null) ? null : (pr-a.rank);
  });
  var t=out.totals;
  if(!n(t.revenue)) t.revenue=out.cities.reduce(function(x,c){return x+c.revenue;},0);
  if(!n(t.units))   t.units  =out.cities.reduce(function(x,c){return x+c.units;},0);
  if(!n(t.target))  t.target =out.cities.reduce(function(x,c){return x+c.target;},0);
  return out;
}

/* =====================================================================
   TOP BAR
   ===================================================================== */
function paintTop(){
  var t=DATA.totals, m=DATA.meta||{};
  document.getElementById('periodSmall').textContent =
    joinDot(m.month||'', m.windowLabel||'') || 'month to date';
  countUp(document.getElementById('coRev'), n(t.revenue), money);
  countUp(document.getElementById('coUnits'), n(t.units), function(v){
    return Math.round(v).toLocaleString('en-IN'); });
  paintFresh();
  var p = pct(t.revenue, t.target), e = expectedPct();
  document.getElementById('coTgt').textContent = t.target ? ('of '+money(t.target)) : '';
  var pc=document.getElementById('coPct');
  pc.textContent = t.target ? p.toFixed(1)+'%' : '—';
  pc.className = 'val '+paceClass(p);
  document.getElementById('coFill').style.width = Math.max(0,Math.min(100,p))+'%';
  document.getElementById('coMark').style.left = e.toFixed(1)+'%';
  document.getElementById('coTrack').className = 'track '+(paceClass(p)==='behind'?'behind':'');
  paintLive();
}
/* THE QUESTION THE BOARD COULD NOT ANSWER.

   "data 4s ago" only says when the FEED last built. The feed can rebuild
   every seven minutes and still be serving yesterday, because it reads
   mdl_Payments and nothing had refreshed that. So report the date of the
   newest payment in the sheet against today's date - that is the only
   honest answer to "is this up to date", and it names the fix when it is
   not. */
function paintFresh(){
  var m=(DATA&&DATA.meta)||{}, el=document.getElementById('fresh');
  if(!el) return;
  var latest=s(m.latestPayment), today=s(m.today);
  if(!latest||!today){ el.className=''; el.textContent=''; return; }
  if(latest>=today){ el.className='ok'; el.innerHTML='sheet current'; return; }
  var d1=new Date(latest+'T00:00:00'), d2=new Date(today+'T00:00:00');
  var days=Math.round((d2-d1)/86400000);
  el.className='warn';
  el.innerHTML='SHEET IS '+days+' DAY'+(days===1?'':'S')+' BEHIND &middot; newest sale '+
               latest.slice(8)+'/'+latest.slice(5,7)+' &middot; run updateAndCheck';
}

function paintLive(){
  var live=document.getElementById('live'), txt=document.getElementById('livetext');
  var link = LAST_OK ? Math.round((Date.now()-LAST_OK)/1000) : null;
  var data = DATA_AT ? Math.round((Date.now()-DATA_AT)/1000) : link;
  if(link==null){ live.className='down'; txt.innerHTML='connecting…'; }
  else if(FAILS>0 && link>CONFIG.REFRESH_SECONDS*3){ live.className='down';
    txt.innerHTML='reconnecting · data <b>'+fmtAge(data)+'</b>'; }
  else if(data>900){ live.className='stale'; txt.innerHTML='data <b>'+fmtAge(data)+'</b>'; }
  else { live.className=''; txt.innerHTML='LIVE · data <b>'+fmtAge(data)+'</b>'; }
}
function fmtAge(x){ if(x==null) return '—';
  if(x<60) return x+'s ago'; if(x<3600) return Math.round(x/60)+'m ago';
  return Math.round(x/3600)+'h ago'; }

/* =====================================================================
   LEFT RAIL - every headline number, cycling
   ===================================================================== */
function buildRail(){
  var t=DATA.totals;
  railItems=[{k:'Company revenue', v:money(t.revenue), u:'', p:pct(t.revenue,t.target), tgt:t.target},
             {k:'Company units', v:n(t.units).toLocaleString('en-IN'), u:'units', p:-1}];
  DATA.cities.forEach(function(c){
    railItems.push({k:c.name+' revenue', v:money(c.revenue), u:'of '+moneyShort(c.target), p:attain(c), tgt:c.target});
    railItems.push({k:c.name+' units', v:n(c.units).toLocaleString('en-IN'), u:'units', p:-1});
  });
  DATA.managers.forEach(function(mg){
    railItems.push({k:mg.name, v:money(mg.revenue), u:joinDot(mg.city, mg.agents+' agents'), p:attain(mg), tgt:mg.target});
  });
  var tr=document.getElementById('railTrack');
  tr.innerHTML = railItems.map(statHTML).join('') + railItems.slice(0,8).map(statHTML).join('');
  if(railIdx >= railItems.length) railIdx = 0;
  moveRail(true);
}
function statHTML(it){
  var hasT = it.p >= 0 && n(it.tgt) > 0;
  var cl = hasT ? paceClass(it.p) : '';
  return '<div class="stat '+cl+'">'+
    '<div class="k">'+esc(it.k)+'</div>'+
    '<div class="r"><div class="v">'+esc(it.v)+'</div><div class="u">'+esc(it.u)+'</div>'+
      (hasT ? '<div class="p">'+it.p.toFixed(0)+'%</div>' : '')+
    '</div>'+
    (hasT ? '<div class="mini"><i style="width:'+Math.max(0,Math.min(100,it.p)).toFixed(1)+'%"></i></div>'
          : '<div style="height:6px"></div>')+
  '</div>';
}
function moveRail(instant){
  var tr=document.getElementById('railTrack');
  if(instant) tr.style.transition='none';
  tr.style.transform='translateY(-'+(railIdx*104)+'px)';
  if(instant){ void tr.offsetHeight; tr.style.transition=''; }
  var it=railItems[railIdx];
  document.getElementById('railNow').textContent = it ? (railIdx+1)+'/'+railItems.length : '';
}
function startRail(){
  clearInterval(railTimer);
  railTimer=setInterval(function(){
    if(!railItems.length) return;
    railIdx++;
    if(railIdx >= railItems.length){       // silently snap back at the seam
      moveRail(false);
      setTimeout(function(){ railIdx=0; moveRail(true); }, 950);
      return;
    }
    moveRail(false);
  }, Math.max(2, CONFIG.RAIL_SECONDS)*1000);
}

/* =====================================================================
   TICKER - the reason to glance up
   ===================================================================== */
function buildTicker(){
  var r=DATA.recent||[], parts=[];
  if(r.length){
    r.forEach(function(x){
      parts.push('<span class="ti"><em>CLOSED</em><b>'+esc(x.name)+'</b>'+
        '<span class="amt">'+money(x.amt)+'</span>'+
        '<span class="mt">'+esc(joinDot(x.city,x.team,x.manager))+'</span>'+
        '<span class="dv">|</span></span>');
    });
  } else {
    /* No recent feed yet - an older deployment. Say what IS known rather
       than running an empty bar, and never invent a sale. */
    DATA.agents.slice(0,12).forEach(function(a){
      parts.push('<span class="ti"><em>MTD</em><b>'+esc(a.name)+'</b>'+
        '<span class="amt">'+money(a.revenue)+'</span>'+
        '<span class="mt">'+esc(joinDot(a.city,a.manager))+' · '+a.units+'u</span>'+
        '<span class="dv">|</span></span>');
    });
    document.querySelector('#tickLab span').textContent='Month To Date';
  }
  if(!parts.length) parts.push('<span class="ti"><span class="mt">No sales recorded yet this month</span></span>');
  /* Doubled so the -50% translate loops seamlessly. */
  var html=parts.join('');
  document.getElementById('tickTrack').innerHTML = html + html;
}

/* =====================================================================
   THE FOUR BLOCKS
   ===================================================================== */
var SLOTS=[ {l:0,   t:0,  w:65.5,h:100},      // big
            {l:67,  t:0,  w:33,  h:32},
            {l:67,  t:34, w:33,  h:32},
            {l:67,  t:68, w:33,  h:32} ];
function layout(){
  for(var i=0;i<4;i++){
    var el=document.getElementById('b'+i);
    var slot=SLOTS[(i - bigIdx + 4) % 4];
    el.style.left=slot.l+'%'; el.style.top=slot.t+'%';
    el.style.width=slot.w+'%'; el.style.height=slot.h+'%';
    el.className='blk '+(slot.w>50?'big':'sm');
  }
}
function schedule(){
  clearTimeout(rotTimer);
  rotTimer=setTimeout(function(){
    bigIdx=(bigIdx+1)%4;
    /* The Agent Arena walks to the next peer group each time it comes
       round, so every desk gets the big slot over a few rotations. */
    if(bigIdx===2) peerIdx++;
    layout(); renderAll(); schedule();
  }, Math.max(8,CONFIG.ROTATE_SECONDS)*1000);
}

function renderAll(){ renderCities(); renderManagers(); renderAgents(); renderPace(); }

function moveHTML(mv){
  if(mv==null) return '';                       // no snapshot yet - say nothing
  if(mv>0) return '<span class="mv up">\u25b2'+mv+'</span>';
  if(mv<0) return '<span class="mv dn">\u25bc'+(-mv)+'</span>';
  return '';
}
function rowHTML(rank,name,sub,p,fig,figsub,hasTarget,mv){
  var cls = rank<=3 ? ' p'+rank : '';
  return '<div class="row'+cls+'" style="animation-delay:'+Math.min(rank*40,320)+'ms">'+
    '<div class="rk">'+rank+'</div>'+
    '<div class="who"><b>'+esc(name)+moveHTML(mv)+'</b><span>'+esc(sub)+'</span></div>'+
    '<div class="bar">'+(hasTarget?barHTML(p):'')+'</div>'+
    '<div class="fig"><b class="'+(hasTarget?paceClass(p):'')+'">'+fig+'</b><span>'+esc(figsub)+'</span></div>'+
  '</div>';
}

function renderCities(){
  var b=document.getElementById('b0');
  b.querySelector('h3').textContent='City Race';
  b.querySelector('.sub').textContent='% of own target · gold line = today’s pace';
  var rows=DATA.cities.map(function(c,i){
    var p=attain(c), has=c.target>0, rk=i+1;
    /* The desks inside this city, each against its own target. Three cities
       across 858px would otherwise be 286px of empty panel per row - the
       exact fault this redesign exists to fix. A big block earns its space
       by carrying more information, not more air. */
    var kids=DATA.managers.filter(function(m){ return m.city===c.name; }).sort(byAttain);
    var kidHTML=kids.map(function(m){
      var mp=attain(m), mh=m.target>0;
      return '<div class="kid"><div class="kn">'+esc(m.name)+
        (m.team?' <i>'+esc(m.team)+'</i>':'')+'</div>'+
        '<div class="kb">'+(mh?barHTML(mp):'')+'</div>'+
        '<div class="kv '+(mh?paceClass(mp):'')+'">'+(mh?mp.toFixed(0)+'%':'-')+'</div>'+
        '<div class="kr">'+money(m.revenue)+'</div></div>';
    }).join('');
    return '<div class="row deep'+(rk<=3?' p'+rk:'')+'" style="animation-delay:'+(rk*60)+'ms">'+
      '<div class="lead"><div class="rk">'+rk+'</div>'+
        '<div class="who"><b>'+esc(c.name)+'</b><span>'+
          esc(joinDot(money(c.revenue)+' of '+money(c.target), c.units+' units', c.agents+' agents'))+
        '</span></div>'+
        '<div class="bar">'+(has?barHTML(p):'')+'</div>'+
        '<div class="fig"><b class="'+(has?paceClass(p):'')+'">'+
          (has?p.toFixed(1)+'%':money(c.revenue))+'</b><span>'+
          esc(has?money(c.revenue):c.units+' units')+'</span></div>'+
      '</div>'+
      (kidHTML?'<div class="kids">'+kidHTML+'</div>':'')+
    '</div>';
  });
  b.querySelector('.bd').innerHTML = rows.join('') || empty('No city data');
}

function renderManagers(){
  var b=document.getElementById('b1');
  b.querySelector('h3').textContent='Manager Race';
  b.querySelector('.sub').textContent='% of own target, not rupees';
  /* Managers with no target cannot be in a target race at all. They are
     listed after the race rather than dropped, so nobody vanishes from the
     wall, but they are not ranked against people who have one. */
  var withT=DATA.managers.filter(function(m){return m.target>0;});
  var noT  =DATA.managers.filter(function(m){return !(m.target>0);});
  var rows=withT.map(function(m,i){
    var p=attain(m);
    return rowHTML(i+1, m.name, joinDot(m.city, m.team, m.agents+' agents'),
                   p, p.toFixed(1)+'%', money(m.revenue), true);
  });
  noT.forEach(function(m){
    rows.push('<div class="row" style="opacity:.55"><div class="rk">—</div>'+
      '<div class="who"><b>'+esc(m.name)+'</b><span>'+esc(joinDot(m.city,m.agents+' agents'))+
      ' · no target set</span></div><div class="bar"></div>'+
      '<div class="fig"><b>'+money(m.revenue)+'</b><span>'+m.units+' units</span></div></div>');
  });
  b.querySelector('.bd').innerHTML = rows.join('') || empty('No manager data');
}

/* Peer groups: a Bangalore India agent is compared with Bangalore India
   agents and nobody else. India and International sell at different prices,
   so a mixed table ranks the price list, not the people. */
function peerGroups(){
  var g={};
  DATA.agents.forEach(function(a){
    var city=a.city||'Unassigned', team=a.team||'All';
    var key=city+' · '+team;
    if(!g[key]) g[key]={key:key, city:city, team:team, list:[]};
    g[key].list.push(a);
  });
  var out=[];
  for(var k in g){ if(g[k].list.length>=2) out.push(g[k]); }
  out.sort(function(x,y){ return x.key<y.key?-1:1; });
  return out;
}

function renderAgents(){
  var b=document.getElementById('b2');
  var groups=peerGroups();
  if(!groups.length){ b.querySelector('h3').textContent='Agent Arena';
    b.querySelector('.sub').textContent='';
    b.querySelector('.bd').innerHTML=empty('Not enough agents to compare'); return; }
  var g=groups[peerIdx % groups.length];
  b.querySelector('h3').textContent=g.city+' — '+g.team;
  b.querySelector('.sub').textContent='within this desk only · '+
    ((peerIdx%groups.length)+1)+' of '+groups.length;
  var list=g.list.slice().sort(byAttain);
  var anyT=list.some(function(a){return a.target>0;});
  var top=list[0] ? (list[0].revenue||1) : 1;
  var rows=list.slice(0,9).map(function(a,i){
    var has=a.target>0, p=has?attain(a):pct(a.revenue,top);
    return rowHTML(i+1, a.name, joinDot(a.manager, a.units+' units'),
                   p, has?p.toFixed(0)+'%':money(a.revenue),
                   has?money(a.revenue):(a.units+' units'), true, a.move);
  });
  if(!anyT) b.querySelector('.sub').textContent += ' · no targets set, shown against desk leader';
  b.querySelector('.bd').innerHTML = rows.join('');
}

function renderPace(){
  var bl=document.getElementById('b3');
  var t=DATA.totals, m=DATA.meta||{};
  bl.querySelector('h3').textContent='Pace & Momentum';
  bl.querySelector('.sub').textContent='where the month lands if nothing changes';
  var day=n(m.day), days=n(m.days)||30, left=Math.max(0,days-day);
  var run = day>0 ? t.revenue/day : 0;
  var proj= run*days;
  var gap = t.target - t.revenue;
  var need= left>0 ? gap/left : gap;
  var p=pct(t.revenue,t.target), e=expectedPct();

  var cards=[
    card('Days left', left+' of '+days, day+' done'),
    card('Run rate', money(run)+'/day', 'need '+money(Math.max(0,need))+'/day'),
    card('Projected', money(proj), proj>=t.target?'clears target':'short by '+money(Math.max(0,t.target-proj))),
    card('Against pace', (p-e>=0?'+':'')+(p-e).toFixed(1)+' pts', 'at '+p.toFixed(1)+'%, pace '+e.toFixed(0)+'%',
         p-e>=0?'ahead':'behind')
  ].join('');

  /* Each city projected on its own run rate. The company number hides
     which desk is actually going to miss, and that is the only part of a
     pace panel anyone can act on. */
  var cityRows=DATA.cities.map(function(c){
    var cp=attain(c), cproj=day>0?(c.revenue/day)*days:0;
    var ok=cproj>=c.target;
    return '<div class="kid" style="padding:4px 0">'+
      '<div class="kn">'+esc(c.name)+'</div>'+
      '<div class="kb">'+(c.target>0?barHTML(cp):'')+'</div>'+
      '<div class="kv '+paceClass(cp)+'">'+(c.target>0?cp.toFixed(0)+'%':'-')+'</div>'+
      '<div class="kr" style="width:112px;color:'+(ok?'var(--mint)':'var(--rose)')+'">'+
        (c.target>0 ? (ok?'clears':'short '+money(Math.max(0,c.target-cproj))) : '')+'</div></div>';
  }).join('');

  /* Framed as a number to chase, not a wall of shame. Anyone at the bottom
     of a leaderboard already knows they are there; what they cannot see is
     how much would move them. */
  var behind=DATA.agents.filter(function(a){return a.target>0 && attain(a) < e-10;})
                        .sort(function(x,y){return attain(x)-attain(y);}).slice(0,4);
  var push = behind.length
    ? '<div class="pushlist" style="margin-top:8px;border-top:1px solid var(--line);padding-top:8px">'+
      '<div class="pl-h">Biggest gap to close</div>'+
      behind.map(function(a){
        return '<div class="pl-r"><b>'+esc(a.name)+'</b>'+
          '<span class="pl-m">'+esc(joinDot(a.city,a.manager))+'</span>'+
          '<span class="pl-v">'+money(Math.max(0,a.target-a.revenue))+' to go</span></div>';
      }).join('')+'</div>'
    : '';

  bl.querySelector('.bd').innerHTML=
    '<div class="pacegrid">'+cards+'</div>'+
    sparkHTML()+
    '<div class="citypace"><div class="pl-h">Each city on its own run rate</div>'+cityRows+'</div>'+
    push;
}

/* DAY BY DAY. A month-to-date total reads the same whether it arrived
   steadily or all in one week, which is the difference between a team that
   is fine and one that is about to miss. The best day is marked so there is
   something to beat, and today is marked so it can be seen being beaten. */
function sparkHTML(){
  var days=DATA.byDay||[];
  if(days.length<2) return '';
  var max=0, best=-1;
  days.forEach(function(x,i){ if(x.rev>max){ max=x.rev; best=i; } });
  if(max<=0) return '';
  var todayNo=n((DATA.meta||{}).day);
  var bars=days.map(function(x,i){
    var h=Math.max(0,Math.round(x.rev/max*100));
    var cls = x.rev<=0 ? 'zero' : (i===best ? 'best' : (x.d===todayNo ? 'today' : ''));
    var lab = (x.d===1||x.d%5===0||x.d===todayNo) ? x.d : '';
    return '<div class="bar '+cls+'" title="'+x.d+': '+money(x.rev)+'">'+
             '<i style="height:'+(x.rev<=0?2:h)+'%"></i>'+
             (lab?'<b>'+lab+'</b>':'')+'</div>';
  }).join('');
  return '<div class="sparkwrap"><div class="pl-h">Revenue by day'+
         (best>=0?' &middot; best was day '+days[best].d+' at '+money(max):'')+
         '</div><div class="spark">'+bars+'</div></div>';
}

function card(k,v,note,cl){
  return '<div class="pcard"><div class="k">'+esc(k)+'</div>'+
    '<div class="v '+(cl||'')+'">'+esc(v)+'</div><div class="n">'+esc(note)+'</div></div>';
}
function empty(msg){
  return '<div style="display:flex;align-items:center;justify-content:center;height:100%;'+
         'color:var(--dim);font-size:19px">'+esc(msg)+'</div>';
}
