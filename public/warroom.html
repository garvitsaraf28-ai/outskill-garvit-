<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Sales Dangal</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@700&display=swap" rel="stylesheet">

<style>
/* =====================================================================
   SALES DANGAL - one live screen.

   WHAT CHANGED, AND WHY

   The board used to rotate FOUR blocks through four slots, so City Race
   might be big-left one minute and small-bottom-right the next. Nothing
   was ever in the same place twice and people could not find the number
   they were looking for - which is the opposite of what a wall is for.

   Now the three columns NEVER MOVE:

     LEFT    agents, one desk at a time
     MIDDLE  the organisation - cities, pace, momentum
     RIGHT   managers

   Only the CONTENT of the left column advances, through one desk at a
   time, and it says loudly which desk it is showing.

   INDIA IS LIME. INTERNATIONAL IS TEAL. Everywhere, with no exceptions.
   The two desks sell at different prices, so mixing them up is the one
   mistake that makes every comparison on the screen meaningless. The
   colour is on the desk heading, on the chip, and on the left edge of
   every single row.
   ===================================================================== */

:root{
  --bg:#070905; --ink:#f0f4e8; --dim:#818f6c; --line:#1c2416;
  --lime:#c2ee45; --lime-dim:#a8d930; --teal:#4dd8c0;
  --gold:#ffd76e; --amber:#e8b24b; --rose:#ff6b8a; --violet:#b39bff;
  --mint:var(--lime); --sky:var(--teal);
  --panel:rgba(16,21,12,.84);

  /* the two desks. One token each, used everywhere. */
  --ind:#c2ee45;        /* India */
  --intl:#4dd8c0;       /* International */
  --nodesk:#818f6c;     /* neither - a data fault, never a third desk */
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink); overflow:hidden;
  font-family:'Space Grotesk',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
#wrap{position:fixed; inset:0; overflow:hidden; display:flex; align-items:center; justify-content:center}

#stage{
  width:1920px; height:1080px; flex:none; position:relative; overflow:hidden;
  transform-origin:center center;
  display:flex; flex-direction:column;
  background:
    radial-gradient(1200px 700px at 12% -10%, rgba(194,238,69,.09), transparent 60%),
    radial-gradient(1000px 600px at 88% 110%, rgba(77,216,192,.09), transparent 60%),
    var(--bg);
}
#stage::before{
  content:''; position:absolute; inset:-25%; pointer-events:none; z-index:0;
  background:
    radial-gradient(520px 520px at 20% 30%, rgba(194,238,69,.10), transparent 60%),
    radial-gradient(620px 620px at 78% 62%, rgba(77,216,192,.09), transparent 60%),
    radial-gradient(480px 480px at 50% 88%, rgba(232,178,75,.07), transparent 60%);
  animation:arena 54s ease-in-out infinite alternate;
}
@keyframes arena{
  0%  {transform:translate3d(-2%,-1%,0) scale(1)}
  50% {transform:translate3d(2%,2%,0) scale(1.06)}
  100%{transform:translate3d(-1%,1%,0) scale(1.02)}
}
#stage > *{position:relative; z-index:1}

/* ------------------------------- TOP BAR ---------------------------- */
#top{
  height:112px; flex:none; display:flex; align-items:center; gap:26px;
  padding:0 26px; border-bottom:2px solid var(--line);
  background:linear-gradient(180deg, rgba(10,14,7,.95), rgba(10,14,7,.6));
}
#brand{display:flex; flex-direction:column; line-height:1; flex:none}
#brand b{
  font-family:Fraunces,Georgia,serif; font-weight:700; font-size:40px; letter-spacing:-.01em;
  background:linear-gradient(92deg,var(--lime),var(--teal) 70%,var(--teal));
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
#brand span{font-size:13px; color:var(--dim); letter-spacing:.34em; margin-top:6px; font-weight:700}

.hero{display:flex; align-items:baseline; gap:14px; flex:none}
.hero .v{font-weight:700; font-size:58px; letter-spacing:.01em; line-height:1}
.hero .k{font-size:12px; color:var(--dim); letter-spacing:.2em; font-weight:800; text-transform:uppercase}
.sep{width:2px; height:52px; background:var(--line); flex:none}

#coBar{flex:1 1 auto; min-width:260px}
#coBar .top{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:7px}
#coBar .lab{font-size:12px; color:var(--dim); letter-spacing:.2em; font-weight:800}
#coBar .val{font-size:22px; font-weight:900; font-variant-numeric:tabular-nums}
.track{position:relative; height:16px; border-radius:9px; background:#141a0e; overflow:visible}
.track > i{
  position:absolute; left:0; top:0; bottom:0; border-radius:9px; display:block;
  background:linear-gradient(90deg,var(--teal),var(--lime));
  transition:width 1.1s cubic-bezier(.22,1,.36,1);
}
.track > u{
  position:absolute; top:-5px; bottom:-5px; width:3px; background:var(--gold);
  border-radius:2px; box-shadow:0 0 10px rgba(255,215,110,.85);
}
.track.behind > i{background:linear-gradient(90deg,var(--amber),var(--rose))}

#live{display:flex; align-items:center; gap:10px; flex:none; font-size:15px; color:var(--dim); font-weight:700}
#live .dot{width:12px; height:12px; border-radius:50%; background:var(--mint); box-shadow:0 0 14px var(--mint); animation:pulse 2s infinite}
#live.stale .dot{background:var(--gold); box-shadow:0 0 14px var(--gold)}
#live.down  .dot{background:var(--rose); box-shadow:0 0 14px var(--rose)}
#live b{color:var(--ink)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

#fresh{
  flex:none; display:none; align-items:center; justify-content:center; gap:10px;
  height:34px; font-size:14px; font-weight:800; letter-spacing:.14em; text-transform:uppercase;
}
#fresh.warn{display:flex; background:var(--rose); color:#1a0509; animation:nudge 2.6s ease-in-out infinite}
@keyframes nudge{0%,100%{opacity:1}50%{opacity:.62}}

/* ------------------------------- BODY ------------------------------- */
/* Three columns. Fixed widths, fixed order, for the whole life of the
   page. Nothing here ever swaps place with anything else. */
#body{flex:1 1 auto; display:flex; gap:16px; padding:14px 24px; min-height:0}
#colAgents{width:600px; flex:none; display:flex; flex-direction:column; min-height:0}
#colOrg   {flex:1 1 auto; display:flex; flex-direction:column; gap:14px; min-width:0}
#colMgr   {width:536px; flex:none; display:flex; flex-direction:column; min-height:0}

.panel{
  border:1px solid var(--line); border-radius:16px; background:var(--panel);
  overflow:hidden; display:flex; flex-direction:column; min-height:0;
}
.panel > .hd{
  flex:none; padding:14px 20px; border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:12px;
}
.panel > .hd h3{
  margin:0; font-weight:700; font-size:21px; letter-spacing:.14em; text-transform:uppercase;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.panel > .hd .sub{
  margin-left:auto; font-size:12px; color:var(--dim); font-weight:700;
  letter-spacing:.12em; white-space:nowrap; text-transform:uppercase;
}
.panel > .bd{flex:1 1 auto; padding:6px 20px 12px; overflow:hidden; display:flex; flex-direction:column; min-height:0}

/* ---------------------- LEFT: the agent column ---------------------- */
#colAgents .panel{flex:1 1 auto}
#deskHead{
  flex:none; padding:16px 20px 14px; border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:14px;
}
#deskName{
  font-family:Fraunces,Georgia,serif; font-weight:700; font-size:34px; line-height:1;
  letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.teamchip{
  flex:none; font-size:13px; font-weight:900; letter-spacing:.18em; text-transform:uppercase;
  padding:6px 13px; border-radius:999px; color:#0c1205; white-space:nowrap;
}
.teamchip.ind {background:var(--ind)}
.teamchip.intl{background:var(--intl)}
.teamchip.none{background:var(--nodesk); color:#0c1205}
#deskMeta{margin-left:auto; text-align:right; font-size:12px; color:var(--dim); font-weight:700; letter-spacing:.1em; white-space:nowrap}
#deskMeta b{display:block; font-size:19px; color:var(--ink); letter-spacing:0; font-variant-numeric:tabular-nums; margin-bottom:2px}

#agentList{flex:1 1 auto; padding:4px 16px 0; overflow:hidden; display:flex; flex-direction:column; justify-content:flex-start}
.arow{
  display:flex; align-items:center; gap:12px; flex:1 1 0; min-height:0; max-height:104px;
  padding:0 10px 0 12px; border-left:4px solid var(--nodesk);
  border-bottom:1px solid rgba(28,36,22,.55); border-radius:3px;
}
.arow:last-child{border-bottom:0}
.arow.ind {border-left-color:var(--ind)}
.arow.intl{border-left-color:var(--intl)}
.arow .rk{width:34px; flex:none; text-align:center; font-weight:700; font-size:21px; color:var(--dim)}
.arow.p1 .rk{color:var(--gold)} .arow.p2 .rk{color:#dfe6cf} .arow.p3 .rk{color:var(--amber)}
.arow .who{flex:1 1 auto; min-width:0}
.arow .who b{display:block; font-size:19px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.arow .who span{display:block; font-size:12px; color:var(--dim); font-weight:600; margin-top:2px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.arow .bar{width:130px; flex:none}
.arow .fig{width:96px; flex:none; text-align:right}
.arow .fig b{display:block; font-size:19px; font-weight:900; font-variant-numeric:tabular-nums}
.arow .fig span{display:block; font-size:12px; color:var(--dim); font-weight:700; margin-top:2px}

#deskDots{flex:none; display:flex; gap:7px; justify-content:center; align-items:center; padding:10px 0 12px}
#deskDots i{width:8px; height:8px; border-radius:50%; background:var(--line); display:block; transition:background .4s, width .4s}
#deskDots i.kin{background:#44561f}
#deskDots i.on{width:26px; border-radius:5px; background:var(--gold)}

/* --------------------- MIDDLE: the organisation --------------------- */
/* Heights are fixed rather than proportional so nothing reflows when a
   number changes width. They must add up: 300 + 252 + 28 of gaps leaves
   274 for the chart inside the 854 the column has. The pace panel was
   184 and clipped its bottom two cards - four cards in two rows need
   252 once the header is counted. */
#pCity{flex:none; height:300px}
#pPace{flex:none; height:252px}
#pDay {flex:1 1 auto; min-height:0}

.crow{display:flex; align-items:center; gap:14px; flex:1 1 0; min-height:0; max-height:112px; padding:4px 0;
  border-bottom:1px solid rgba(28,36,22,.55)}
.crow:last-child{border-bottom:0}
.crow .rk{width:34px; flex:none; text-align:center; font-weight:700; font-size:24px; color:var(--dim)}
.crow.p1 .rk{color:var(--gold)} .crow.p2 .rk{color:#dfe6cf} .crow.p3 .rk{color:var(--amber)}
.crow .who{flex:1 1 auto; min-width:0}
.crow .who b{display:block; font-size:25px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.crow .who span{display:block; font-size:12px; color:var(--dim); font-weight:600; margin-top:3px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.crow .bar{width:190px; flex:none}
.crow .fig{width:110px; flex:none; text-align:right}
.crow .fig b{display:block; font-size:24px; font-weight:900; font-variant-numeric:tabular-nums}
.crow .fig span{display:block; font-size:12px; color:var(--dim); font-weight:700; margin-top:2px}

.pacegrid{display:flex; flex-wrap:wrap; gap:11px; align-content:flex-start; padding-top:4px}
.pcard{flex:1 1 44%; min-width:0; border:1px solid var(--line); border-radius:12px; padding:11px 14px;
  background:rgba(9,13,6,.55)}
.pcard .k{font-size:11px; letter-spacing:.16em; color:var(--dim); font-weight:800; text-transform:uppercase}
.pcard .v{font-weight:700; font-size:30px; margin-top:6px; line-height:1}
.pcard .n{font-size:12px; color:var(--dim); margin-top:5px; font-weight:600;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}

.spark{display:flex; align-items:flex-end; gap:4px; flex:1 1 auto; min-height:0; padding:6px 0 20px}
.spark .bar{flex:1 1 auto; min-width:0; display:flex; flex-direction:column; justify-content:flex-end;
  height:100%; position:relative}
.spark .bar i{display:block; border-radius:3px 3px 0 0; background:var(--teal); opacity:.75;
  transition:height .8s cubic-bezier(.22,1,.36,1)}
.spark .bar.best i{background:var(--lime); opacity:1}
.spark .bar.today i{background:var(--gold); opacity:1}
.spark .bar.zero i{background:var(--line); opacity:1; min-height:2px}
.spark .bar b{position:absolute; bottom:-17px; left:0; right:0; text-align:center;
  font-size:10px; color:var(--dim); font-weight:700}

/* ---------------------- RIGHT: the manager column ------------------- */
#colMgr .panel{flex:1 1 auto}
#mgrList{flex:1 1 auto; padding:4px 18px 0; overflow:hidden; display:flex; flex-direction:column; justify-content:flex-start}
.mrow{display:flex; align-items:center; gap:11px; flex:1 1 0; min-height:0; max-height:94px;
  padding:0 6px 0 11px; border-left:4px solid var(--nodesk);
  border-bottom:1px solid rgba(28,36,22,.55); border-radius:3px}
.mrow:last-child{border-bottom:0}
.mrow.ind {border-left-color:var(--ind)}
.mrow.intl{border-left-color:var(--intl)}
.mrow.both{border-left-color:var(--gold)}
.mrow .rk{width:30px; flex:none; text-align:center; font-weight:700; font-size:20px; color:var(--dim)}
.mrow.p1 .rk{color:var(--gold)} .mrow.p2 .rk{color:#dfe6cf} .mrow.p3 .rk{color:var(--amber)}
.mrow .who{flex:1 1 auto; min-width:0}
.mrow .who b{display:block; font-size:19px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.mrow .who span{display:block; font-size:12px; color:var(--dim); font-weight:600; margin-top:2px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.mrow .bar{width:96px; flex:none}
.mrow .fig{width:92px; flex:none; text-align:right}
.mrow .fig b{display:block; font-size:19px; font-weight:900; font-variant-numeric:tabular-nums}
.mrow .fig span{display:block; font-size:12px; color:var(--dim); font-weight:700; margin-top:2px}
.mrow.notgt{opacity:.5}

.pcttag{font-variant-numeric:tabular-nums}
.ahead{color:var(--mint)} .behind{color:var(--rose)} .flat{color:var(--gold)}
.mv{font-size:12px; font-weight:800; margin-left:7px}
.mv.up{color:var(--lime)} .mv.dn{color:var(--rose)} .mv.nu{color:var(--gold)}

/* ------------------------------ TICKER ------------------------------ */
/* Taller, bigger, and the speed is now a constant NUMBER OF PIXELS PER
   SECOND rather than a fixed 64s for the whole loop. It used to be the
   latter, which meant forty closes scrolled four times faster than ten
   and neither was the speed anyone chose. */
#tick{
  height:86px; flex:none; border-top:2px solid var(--line); display:flex; align-items:stretch;
  background:linear-gradient(180deg, rgba(10,14,7,.7), rgba(10,14,7,.96)); overflow:hidden;
}
#tickLab{
  flex:none; width:244px; display:flex; align-items:center; justify-content:center; gap:11px;
  background:linear-gradient(92deg,var(--lime),var(--teal));
  font-weight:700; font-size:21px; letter-spacing:.13em; text-transform:uppercase;
  color:#0a1004; white-space:nowrap;
}
#tickLab i{width:11px; height:11px; border-radius:50%; background:#0a1004; animation:pulse 1.4s infinite; font-style:normal}
#tickView{flex:1 1 auto; overflow:hidden; display:flex; align-items:center; position:relative}
#tickTrack{display:inline-flex; white-space:nowrap; will-change:transform;
  animation:tick 90s linear infinite}
#tick:hover #tickTrack{animation-play-state:paused}
@keyframes tick{from{transform:translate3d(0,0,0)} to{transform:translate3d(-50%,0,0)}}
.ti{display:inline-flex; align-items:center; gap:15px; padding:0 40px; font-size:27px; flex:none}
.ti em{font-style:normal; color:var(--gold); font-weight:900; font-size:16px; letter-spacing:.14em}
.ti b{font-weight:800}
.ti .amt{font-family:Space Mono,monospace; font-weight:700; color:var(--mint)}
.ti .mt{color:var(--dim); font-size:17px; font-weight:600}
.ti .dv{color:var(--line)}

#tick.hot{box-shadow:inset 0 0 0 2px var(--lime), 0 -16px 46px rgba(194,238,69,.16)}
#tick.hot #tickLab{animation:hotlab .7s ease-in-out infinite alternate}
@keyframes hotlab{from{filter:brightness(1)} to{filter:brightness(1.35)}}
#hot{
  position:absolute; inset:0; display:none; align-items:center; gap:18px; padding-left:38px;
  background:linear-gradient(90deg, rgba(10,14,7,.98) 78%, rgba(10,14,7,0));
  font-size:29px; font-weight:800;
}
#hot.on{display:flex; animation:hotIn .45s cubic-bezier(.22,1,.36,1)}
#hot em{font-style:normal; font-size:14px; letter-spacing:.2em; color:var(--lime); font-weight:900}
#hot .amt{font-family:'Space Mono',monospace; color:var(--lime)}
#hot .mt{font-size:17px; color:var(--dim); font-weight:600}
@keyframes hotIn{from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:none}}

/* --------------------- NEW ON THE FLOOR takeover -------------------- */
/* A full-screen welcome card for a new joiner, every few minutes. The
   leaderboard is still there underneath and comes straight back - this
   is a cutaway, not a mode. */
#joinCard{
  position:absolute; inset:0; z-index:60; display:none; align-items:center; gap:72px;
  padding:0 110px;
  background:
    radial-gradient(900px 700px at 22% 50%, rgba(194,238,69,.13), transparent 62%),
    radial-gradient(800px 600px at 82% 55%, rgba(77,216,192,.12), transparent 62%),
    #060803;
}
#joinCard.on{display:flex; animation:jcIn .55s cubic-bezier(.22,1,.36,1)}
@keyframes jcIn{from{opacity:0} to{opacity:1}}
#jcPhotoWrap{
  flex:none; width:440px; height:560px; border-radius:26px; overflow:hidden; position:relative;
  background:linear-gradient(150deg,#1a2112,#0d1208);
  box-shadow:0 36px 90px rgba(0,0,0,.65), 0 0 0 1px rgba(194,238,69,.22);
}
#jcPhoto{width:100%; height:100%; object-fit:cover; display:block; animation:jcPan 9s ease-out both}
@keyframes jcPan{from{transform:scale(1.1)} to{transform:scale(1.005)}}
#jcInitials{
  position:absolute; inset:0; display:none; align-items:center; justify-content:center;
  font-family:Fraunces,Georgia,serif; font-weight:700; font-size:150px; color:var(--lime); opacity:.5;
}
#jcText{flex:1 1 auto; min-width:0; animation:jcUp .7s cubic-bezier(.22,1,.36,1) both}
@keyframes jcUp{from{opacity:0; transform:translateY(22px)} to{opacity:1; transform:none}}
#jcEyebrow{
  font-size:16px; letter-spacing:.34em; font-weight:900; text-transform:uppercase;
  background:linear-gradient(92deg,var(--lime),var(--teal));
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
#jcName{
  font-family:Fraunces,Georgia,serif; font-weight:700; font-size:88px; line-height:1.03;
  margin:16px 0 18px; letter-spacing:-.015em;
}
#jcRole{
  display:inline-block; font-size:17px; font-weight:800; letter-spacing:.14em; text-transform:uppercase;
  padding:9px 20px; border-radius:999px; border:1px solid rgba(194,238,69,.4); color:var(--lime);
}
#jcQuote{
  margin-top:30px; font-size:28px; line-height:1.55; color:#d7e0c8; max-width:980px;
  border-left:4px solid var(--lime); padding-left:26px; font-weight:500;
}
#jcCount{margin-top:34px; font-size:15px; letter-spacing:.24em; color:var(--dim); font-weight:800; text-transform:uppercase}

/* ---------------------------- STATE SCREEN -------------------------- */
#state{
  position:absolute; inset:0; z-index:40; display:none; align-items:center; justify-content:center;
  background:rgba(7,9,5,.97); padding:70px; text-align:center;
}
#state.on{display:flex}
#state .kicker{font-size:17px; letter-spacing:.3em; color:var(--rose); font-weight:800; text-transform:uppercase}
#state .line{font-weight:700; font-size:94px; margin:20px 0 26px; line-height:1}
#state .accent{color:var(--gold)}
#state .note{font-size:21px; color:var(--dim); line-height:1.6; max-width:1250px; margin:0 auto}
#state code{font-family:Space Mono,monospace; color:var(--sky); font-size:19px}

#sig{
  position:absolute; top:7px; right:16px; z-index:20;
  font-size:11px; letter-spacing:.22em; color:var(--ink); opacity:.45;
  font-weight:500; text-transform:uppercase; pointer-events:none;
}
#banner{
  position:absolute; top:0; left:50%; transform:translateX(-50%); z-index:30;
  background:var(--lime); color:#0f1405; font-weight:900; font-size:14px; letter-spacing:.18em;
  padding:6px 26px; border-radius:0 0 12px 12px; display:none; text-transform:uppercase;
}
#banner.on{display:block}

.empty{display:flex; align-items:center; justify-content:center; height:100%; color:var(--dim); font-size:18px; text-align:center; padding:0 20px}

.arow, .mrow, .crow, .pcard{animation:liftIn .45s cubic-bezier(.22,1,.36,1) backwards}
@keyframes liftIn{from{opacity:0; transform:translateY(9px)} to{opacity:1; transform:none}}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important}
}
</style>

<div id="wrap">
<div id="stage">
  <div id="banner"></div>

  <div id="top">
    <div id="brand"><b>SALES DANGAL</b><span id="periodSmall">month to date</span></div>
    <div class="sep"></div>
    <div class="hero"><div><div class="k">Revenue</div><div class="v" id="coRev">&mdash;</div></div></div>
    <div class="hero"><div><div class="k">Units</div><div class="v" id="coUnits">&mdash;</div></div></div>
    <div class="sep"></div>
    <div id="coBar">
      <div class="top">

<script>
/* =====================================================================

var Q = new URLSearchParams(location.search);
var CONFIG = {

  /* Ticker speed in PIXELS PER SECOND, not seconds per loop. The old
     board used a fixed 64s for the whole track, so the more closes there

  FILL: Q.get('fill') === '1',

  JOINER_SECS:    +(Q.get('joinersecs')  || 9),    // seconds per card
  JOINER_PER_RUN: +(Q.get('joinerrun')   || 3),    // cards per cutaway
  /* Stops playing by itself after this date, so nobody has to remember
     to switch it off. Pass ?joineruntil=2026-12-31 to extend. */
  JOINER_UNTIL:   Q.get('joineruntil') || '2026-11-15',
  /* Absolute so the photos resolve whether this page is served from
     Vercel or from Apps Script. */
  JOINER_BASE:    Q.get('joinerbase') || 'https://outskill-garvit.vercel.app/joiners/'
};

];

/* =====================================================================
   STATE
   ===================================================================== */
var DATA = null, LAST_OK = 0, DATA_AT = 0, FAILS = 0, USING_SAMPLE = false;
var prevAgentRank = {}, lastSig = '';
var deskIdx = 0, deskTimer = null;
var running = false;
var jcTimer = null, jcIdx = 0;

/* =====================================================================
   UTIL
   ===================================================================== */
function n(x){ if(typeof x==='string') x=x.replace(/,/g,''); x=Number(x); return isFinite(x)?x:0; }
function s(x){ return x==null?'':String(x); }
function money(v){ v=n(v); var a=Math.abs(v);
  if(a>=10000000) return (v/10000000).toFixed(2)+' cr';
  if(a>=100000)   return (v/100000).toFixed(2)+' L';
  return Math.round(v).toLocaleString('en-IN'); }
function moneyShort(v){ v=n(v); var a=Math.abs(v);
  if(a===0) return '0';
  if(a>=10000000) return (v/10000000).toFixed(2)+'cr';
  if(a<100000) return Math.round(v).toLocaleString('en-IN');
  return (v/100000).toFixed(1)+'L'; }
function pct(a,b){ b=n(b); return b>0 ? (n(a)/b)*100 : 0; }
function esc(x){ return String(x==null?'':x).replace(/[&<>"']/g,function(c){
  return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }
function joinDot(){ return Array.prototype.slice.call(arguments)
  .filter(function(v){return v!==''&&v!=null;}).join(' · '); }

function countUp(node, to, fmt, ms){
  if(!node) return;
  var from = node._val==null ? 0 : node._val;
  node._val = to;
  if(from===to){ node.textContent=fmt(to); return; }
  var t0=performance.now(); ms=ms||900;
  if(node._raf) cancelAnimationFrame(node._raf);
  function step(t){
    var p=Math.min((t-t0)/ms,1), e=1-Math.pow(1-p,3);
    node.textContent=fmt(from+(to-from)*e);
    if(p<1) node._raf=requestAnimationFrame(step); else node._raf=null;
  }
  node._raf=requestAnimationFrame(step);
}

/* THE COMPARISON RULE, IN ONE PLACE.
   Ranking by rupees mostly reports who was given the biggest number to
   chase - managers here carry targets from 34 L to 1.4 cr. Attainment
   against own target is the only comparison where every row answers the
   same question. */
function attain(x){ return pct(x.revenue, x.target); }
function byAttain(a,b){
  var pa=attain(a), pb=attain(b);
  if(pa>0||pb>0) return pb-pa || b.revenue-a.revenue;
  return b.revenue-a.revenue || b.units-a.units;
}
function expectedPct(){
  var m = (DATA&&DATA.meta)||{}; var d=n(m.day), t=n(m.days);
  return (t>0 && d>0) ? Math.min(100,(d/t)*100) : 0;
}
function paceClass(p){
  var e=expectedPct(); if(!e) return 'flat';
  if(p >= e+4) return 'ahead'; if(p <= e-4) return 'behind'; return 'flat';
}
function barHTML(p, h){
  var cl = paceClass(p), e = expectedPct();
  return '<div class="track '+(cl==='behind'?'behind':'')+'" style="height:'+(h||11)+'px">'+
           '<i style="width:'+Math.max(0,Math.min(100,p)).toFixed(1)+'%"></i>'+
           (e? '<u style="left:'+e.toFixed(1)+'%"></u>':'')+
         '</div>';
}

/* INDIA IS LIME, INTERNATIONAL IS TEAL, anything else is grey and says
   so. One function decides it, so nothing on the screen can disagree
   with anything else about which desk somebody is on. */
function teamClass(t){
  var v = s(t).trim().toLowerCase();
  if(v==='india') return 'ind';
  if(v==='international') return 'intl';
  if(v.indexOf('/')>-1) return 'both';
  return 'none';
}
function teamLabel(t){
  var v = s(t).trim();
  return v ? v : 'NO TEAM SET';
}

/* =====================================================================
   STAGE SCALING
   ===================================================================== */
function fit(){
  var w = document.documentElement.clientWidth  || window.innerWidth  || 1920;
  var h = document.documentElement.clientHeight || window.innerHeight || 1080;
  var st = document.getElementById('stage');
  if (st) {
    if (CONFIG.FILL) {
      st.style.transform = 'scale(' + (w / 1920) + ',' + (h / 1080) + ')';
    } else {
      var k = Math.min(w / 1920, h / 1080);
      if (!(k > 0)) k = 1;
      st.style.transform = 'scale(' + k + ')';
    }
  }
}
window.addEventListener('resize', fit);
window.addEventListener('load', fit);
if (typeof ResizeObserver === 'function') {
  try { new ResizeObserver(fit).observe(document.documentElement); } catch (e) {}
}
[60, 250, 800, 2000].forEach(function(ms){ setTimeout(fit, ms); });

function goFull(){ var e=document.documentElement;
  if(document.fullscreenElement) document.exitFullscreen();
  else if(e.requestFullscreen) e.requestFullscreen().catch(function(){}); }
document.addEventListener('keydown', function(e){
  if(e.key==='f'||e.key==='F') goFull();
  if(e.key==='ArrowRight'){ clearTimeout(deskTimer); deskIdx++; renderAgents(); scheduleDesk(); }
  if(e.key==='ArrowLeft'){ clearTimeout(deskTimer); deskIdx=Math.max(0,deskIdx-1); renderAgents(); scheduleDesk(); }
  if(e.key==='j'||e.key==='J') playJoiners();   // show the welcome cards now
});

/* =====================================================================
   DATA - JSONP, because an Apps Script Web App is not reliably
   CORS-fetchable cross-origin. A <script> tag always works.
   ===================================================================== */
var jsonpSeq = 0;
function loadData(){
  if(!CONFIG.API_URL){ stateScreen('not-configured'); return; }
  var cb='__wr'+(++jsonpSeq), done=false;
  var sc=document.createElement('script');
  var url=CONFIG.API_URL+(CONFIG.API_URL.indexOf('?')>-1?'&':'?')+'callback='+cb+'&t='+Date.now();
  var timer=setTimeout(function(){ if(!done){ cleanup(); fail(); } }, 90000);
  window[cb]=function(p){ done=true; clearTimeout(timer); cleanup();
    if(p&&p.ok) applyData(p); else fail(); };
  function cleanup(){ try{delete window[cb];}catch(e){window[cb]=undefined;}
    if(sc.parentNode) sc.parentNode.removeChild(sc); }
  sc.onerror=function(){ if(!done){ clearTimeout(timer); cleanup(); fail(); } };
  sc.src=url; document.head.appendChild(sc);
}

/* A board with no real data must SAY so, never fall back to plausible
   numbers. A wrong figure read confidently off a wall is worse than an
   obviously broken screen, because nobody checks it. */
function fail(){
  FAILS++;
  if(!DATA){ stateScreen('unreachable'); return; }
  paintLive();
}

function stateScreen(kind){
  running=false; clearTimeout(deskTimer);
  var body = (kind==='not-configured')
    ? { k:'Setup needed', line:'NO <span class="accent">FEED</span> CONNECTED',
        note:'Open this page with the Apps Script web app URL on the end:<br>'+
             '<code>?api=&lt;your /exec URL&gt;?feed=warroom</code>' }
    : { k:'Cannot reach the feed', line:'NO <span class="accent">DATA</span> YET',
        note:'<b>Click the address below.</b> What it shows names the fault: the Executive '+
             'Command Center means the routing line is missing from doGet; a Google sign-in '+
             'means access is not set to <b>Anyone</b>; "Script function not found" means the '+
             'deployment is pinned to an old version.'+
             '<div style="margin-top:16px"><a href="'+esc(CONFIG.API_URL)+'" target="_blank" '+
             'rel="noopener" style="font-family:Space Mono,monospace;font-size:17px;color:var(--gold);'+
             'word-break:break-all;text-decoration:underline">'+esc(CONFIG.API_URL)+'</a></div>'+
             '<div style="margin-top:12px;font-size:18px">'+
             (FAILS>0 ? ('No answer after '+FAILS+' attempt'+(FAILS===1?'':'s')+'. Retrying every ')
                      : 'Trying now, then every ')+
             Math.max(10,CONFIG.REFRESH_SECONDS)+' seconds.</div>' };
  var st=document.getElementById('state');
  st.className='on';
  st.innerHTML='<div><div class="kicker">'+body.k+'</div><div class="line">'+body.line+
               '</div><div class="note">'+body.note+'</div></div>';
  paintLive();
}

function applyData(p){
  if(DATA&&DATA.agents){ prevAgentRank={};
    DATA.agents.forEach(function(a,i){ prevAgentRank[a.name]=i+1; }); }
  DATA = normalise(p);
  USING_SAMPLE = !!p.sample;
  document.getElementById('state').className='';
  LAST_OK=Date.now(); FAILS=0;
  var built=n(DATA.meta&&DATA.meta.generatedAt), skew=Math.abs(Date.now()-built);
  DATA_AT = (built>0 && skew<86400000) ? built : LAST_OK;

  var b=document.getElementById('banner');
  b.className = USING_SAMPLE ? 'on' : '';
  b.textContent = USING_SAMPLE ? 'PREVIEW DATA' : '';

  paintTop(); buildTicker(); flashNewSale();

  var sig=signature(DATA);
  if(!running){
    running=true; lastSig=sig;
    renderAll(); scheduleDesk(); scheduleJoiners();
    /* ?joinersnow=1 plays the welcome cards immediately instead of
       waiting for the first cutaway - for checking they look right
       without standing in front of the TV for twelve minutes. */
    if(Q.get('joinersnow')==='1') setTimeout(playJoiners, 400);
    return;
  }
  if(sig!==lastSig){ lastSig=sig; renderAll(); }
}

var lastSaleKey=null;
function flashNewSale(){
  var r=(DATA.recent||[])[0];
  if(!r){ return; }
  var key=r.name+'|'+r.amt+'|'+r.at;
  if(lastSaleKey===null){ lastSaleKey=key; return; }
  if(key===lastSaleKey) return;
  lastSaleKey=key;
  var hot=document.getElementById('hot'), bar=document.getElementById('tick');
  if(!hot||!bar) return;
  hot.innerHTML='<em>JUST IN</em><b>'+esc(r.name)+'</b>'+
                '<span class="amt">'+money(r.amt)+'</span>'+
                '<span class="mt">'+esc(joinDot(r.city,r.team,r.manager))+'</span>';
  hot.className='on'; bar.className='hot';
  clearTimeout(hot._h);
  hot._h=setTimeout(function(){ hot.className=''; bar.className=''; }, 9000);
}

function signature(d){
  return [d.totals.revenue,d.totals.units,d.totals.target,d.cities.length,d.managers.length]
    .concat(d.agents.slice(0,80).map(function(a){return a.name+':'+a.revenue+':'+a.units;}))
    .concat((d.recent||[]).slice(0,10).map(function(r){return r.name+':'+r.amt;}))
    .join('|');
}

function normalise(p){
  p=p||{};
  var out={
    meta:p.meta||{}, totals:p.totals||{},
    cities:(p.cities||[]).filter(function(c){return c&&c.name;}),
    managers:(p.managers||[]).filter(function(m){return m&&m.name;}),
    agents:(p.agents||[]).filter(function(a){return a&&a.name;}),
    recent:(p.recent||[]).filter(function(r){return r&&r.name;}),
    byDay:(p.byDay||[]).filter(function(d){return d&&d.d;}),
    contest:p.contest||{active:false}
  };
  function clean(x){
    x.name=s(x.name); x.manager=s(x.manager); x.city=s(x.city); x.team=s(x.team);
    x.revenue=n(x.revenue); x.units=n(x.units); x.target=n(x.target); x.agents=n(x.agents);
    return x;
  }
  out.cities.forEach(clean); out.managers.forEach(clean); out.agents.forEach(clean);
  out.recent.forEach(function(r){ r.name=s(r.name); r.city=s(r.city); r.team=s(r.team);
    r.manager=s(r.manager); r.amt=n(r.amt); r.at=n(r.at); });
  out.byDay.forEach(function(d){ d.d=n(d.d); d.rev=n(d.rev); d.units=n(d.units); });

  out.cities.sort(byAttain); out.managers.sort(byAttain);
  out.agents.sort(function(a,b){ return b.revenue-a.revenue || b.units-a.units; });
  out.agents.forEach(function(a,i){
    a.rank=i+1;
    var pr = a.prevRank!=null ? a.prevRank : prevAgentRank[a.name];
    a.move = (pr==null) ? null : (pr-a.rank);
  });
  var t=out.totals;
  if(!n(t.revenue)) t.revenue=out.cities.reduce(function(x,c){return x+c.revenue;},0);
  if(!n(t.units))   t.units  =out.cities.reduce(function(x,c){return x+c.units;},0);
  if(!n(t.target))  t.target =out.cities.reduce(function(x,c){return x+c.target;},0);
  return out;
}

/* =====================================================================
   TOP BAR
   ===================================================================== */
function paintTop(){
  var t=DATA.totals, m=DATA.meta||{};
  document.getElementById('periodSmall').textContent =
    joinDot(m.month||'', m.windowLabel||'') || 'month to date';
  countUp(document.getElementById('coRev'), n(t.revenue), money);
  countUp(document.getElementById('coUnits'), n(t.units), function(v){
    return Math.round(v).toLocaleString('en-IN'); });
  paintFresh();
  var p = pct(t.revenue, t.target), e = expectedPct();
  document.getElementById('coTgt').textContent = t.target ? ('of '+money(t.target)) : '';
  var pc=document.getElementById('coPct');
  pc.textContent = t.target ? p.toFixed(1)+'%' : '—';
  pc.className = 'val '+paceClass(p);
  document.getElementById('coFill').style.width = Math.max(0,Math.min(100,p))+'%';
  document.getElementById('coMark').style.left = e.toFixed(1)+'%';
  document.getElementById('coTrack').className = 'track '+(paceClass(p)==='behind'?'behind':'');
  paintLive();
}

/* "data 4s ago" only says when the FEED last built. The feed can rebuild
   every seven minutes and still serve yesterday, because it reads
   mdl_Payments and nothing had refreshed that. So report the date of the
   newest payment in the sheet against today - the only honest answer to
   "is this up to date", and it names the fix when it is not. */
function paintFresh(){
  var m=(DATA&&DATA.meta)||{}, el=document.getElementById('fresh');
  if(!el) return;
  var latest=s(m.latestPayment), today=s(m.today);
  if(!latest||!today){ el.className=''; el.textContent=''; return; }
  if(latest>=today){ el.className='ok'; el.innerHTML='sheet current'; return; }
  var d1=new Date(latest+'T00:00:00'), d2=new Date(today+'T00:00:00');
  var days=Math.round((d2-d1)/86400000);
  el.className='warn';
  el.innerHTML='SHEET IS '+days+' DAY'+(days===1?'':'S')+' BEHIND &middot; newest sale '+
               latest.slice(8)+'/'+latest.slice(5,7)+' &middot; run updateAndCheck';
}

function paintLive(){
  var live=document.getElementById('live'), txt=document.getElementById('livetext');
  var link = LAST_OK ? Math.round((Date.now()-LAST_OK)/1000) : null;
  var data = DATA_AT ? Math.round((Date.now()-DATA_AT)/1000) : link;
  if(link==null){ live.className='down'; txt.innerHTML='connecting…'; }
  else if(FAILS>0 && link>CONFIG.REFRESH_SECONDS*3){ live.className='down';
    txt.innerHTML='reconnecting · data <b>'+fmtAge(data)+'</b>'; }
  else if(data>900){ live.className='stale'; txt.innerHTML='data <b>'+fmtAge(data)+'</b>'; }
  else { live.className=''; txt.innerHTML='LIVE · data <b>'+fmtAge(data)+'</b>'; }
}
function fmtAge(x){ if(x==null) return '—';
  if(x<60) return x+'s ago'; if(x<3600) return Math.round(x/60)+'m ago';
  return Math.round(x/3600)+'h ago'; }

function renderAll(){ renderAgents(); renderCities(); renderPace(); renderDay(); renderManagers(); }

/* =====================================================================
   LEFT COLUMN - agents, one desk at a time

   A desk is a CITY and a TEAM together, because that is the only group
   where everyone is answering the same question: Bangalore International
   sells at different prices from Bangalore India, so a mixed table ranks
   the price list rather than the people.
   ===================================================================== */
var AGENT_ROWS = 9;        /* how many fit in the column at a readable size */

/* Every desk, split into pages that fit the column.

   Hyderabad India carries fifteen agents and nine rows fit, so it
   becomes two pages rather than six people nobody ever sees. "I can see
   agents individually" has to mean ALL of them, in turn - a leaderboard
   that silently drops the bottom third is just a top-nine list. */
function deskViews(){
  var g={};
  (DATA.agents||[]).forEach(function(a){
    var city=a.city||'Unassigned', team=a.team||'';
    var key=city+'\u0000'+team;
    if(!g[key]) g[key]={city:city, team:team, list:[], revenue:0, units:0};
    g[key].list.push(a);
    g[key].revenue+=a.revenue; g[key].units+=a.units;
  });
  var ds=[];
  for(var k in g) ds.push(g[k]);
  /* Biggest desks first, so the busiest teams come round soonest. */
  ds.sort(function(x,y){ return y.list.length-x.list.length ||
                                (x.city<y.city?-1:1) || (x.team<y.team?-1:1); });

  var views=[];
  ds.forEach(function(d){
    var rows=d.list.slice().sort(byAttain);
    var pages=Math.max(1, Math.ceil(rows.length/AGENT_ROWS));
    for(var p=0;p<pages;p++){
      views.push({
        city:d.city, team:d.team, revenue:d.revenue, units:d.units,
        headcount:d.list.length,
        rows:rows.slice(p*AGENT_ROWS,(p+1)*AGENT_ROWS),
        from:p*AGENT_ROWS, page:p+1, pages:pages,
        anyT:rows.some(function(a){return a.target>0;}),
        top:rows[0] ? (rows[0].revenue||1) : 1
      });
    }
  });
  return views;
}

function renderAgents(){
  var vs=deskViews();
  var list=document.getElementById('agentList');
  var dots=document.getElementById('deskDots');
  if(!vs.length){
    document.getElementById('deskName').textContent='Agents';
    document.getElementById('deskTeam').className='teamchip none';
    document.getElementById('deskTeam').textContent='—';
    document.getElementById('deskMeta').innerHTML='<b>—</b><span>&nbsp;</span>';
    list.innerHTML='<div class="empty">No agents in this month’s roster.</div>';
    dots.innerHTML='';
    return;
  }
  if(deskIdx>=vs.length) deskIdx=0;
  var v=vs[deskIdx];
  var tc=teamClass(v.team);

  document.getElementById('deskName').textContent=v.city;
  var chip=document.getElementById('deskTeam');
  chip.className='teamchip '+tc;
  chip.textContent=teamLabel(v.team);

  document.getElementById('deskMeta').innerHTML=
    '<b>'+money(v.revenue)+'</b><span>'+v.headcount+' agents · '+v.units+' units'+
    (v.pages>1 ? ' · page '+v.page+'/'+v.pages : '')+'</span>';

  list.innerHTML = v.rows.map(function(a,i){
    var has=a.target>0, p=has?attain(a):pct(a.revenue,v.top);
    var rk=v.from+i+1;                  /* rank within the desk, not the page */
    return '<div class="arow '+tc+(rk<=3?' p'+rk:'')+'" style="animation-delay:'+((i+1)*35)+'ms">'+
      '<div class="rk">'+rk+'</div>'+
      '<div class="who"><b>'+esc(a.name)+moveHTML(a.move)+'</b>'+
        '<span>'+esc(joinDot(a.manager, a.units+' units'))+'</span></div>'+
      '<div class="bar">'+barHTML(p)+'</div>'+
      '<div class="fig"><b class="'+(has?paceClass(p):'')+'">'+
        (has?p.toFixed(0)+'%':money(a.revenue))+'</b>'+
        '<span>'+esc(has?money(a.revenue):(a.units+' units'))+'</span></div>'+
    '</div>';
  }).join('');

  if(!v.anyT && v.rows.length){
    list.innerHTML += '<div style="flex:none;padding:8px 0 0;font-size:12px;color:var(--dim);'+
      'font-weight:700">no targets set on this desk · shown against the desk leader</div>';
  }

  /* One dot per page. The dots belonging to the desk currently on screen
     are lit dimly, so a second page reads as "still Hyderabad" rather
     than as a desk nobody recognises. */
  dots.innerHTML = vs.map(function(x,i){
    var kin = (x.city===v.city && x.team===v.team);
    return '<i class="'+(i===deskIdx?'on':(kin?'kin':''))+'"></i>';
  }).join('');
}

function scheduleDesk(){
  clearTimeout(deskTimer);
  deskTimer=setTimeout(function(){
    var vs=deskViews();
    deskIdx = vs.length ? (deskIdx+1) % vs.length : 0;
    renderAgents();
    scheduleDesk();
  }, Math.max(6,CONFIG.DESK_SECONDS)*1000);
}

function moveHTML(mv){
  if(mv==null) return '';
  if(mv>0) return '<span class="mv up">▲'+mv+'</span>';
  if(mv<0) return '<span class="mv dn">▼'+(-mv)+'</span>';
  return '';
}

/* =====================================================================
   MIDDLE COLUMN - the organisation
   ===================================================================== */
function renderCities(){
  var bd=document.getElementById('cityBd');
  if(!DATA.cities.length){ bd.innerHTML='<div class="empty">No city data</div>'; return; }
  bd.innerHTML = DATA.cities.map(function(c,i){
    var p=attain(c), has=c.target>0, rk=i+1;
    return '<div class="crow'+(rk<=3?' p'+rk:'')+'" style="animation-delay:'+(rk*60)+'ms">'+
      '<div class="rk">'+rk+'</div>'+
      '<div class="who"><b>'+esc(c.name)+'</b><span>'+
        esc(joinDot(money(c.revenue)+' of '+money(c.target), c.units+' units', c.agents+' agents'))+
      '</span></div>'+
      '<div class="bar">'+(has?barHTML(p,13):'')+'</div>'+
      '<div class="fig"><b class="'+(has?paceClass(p):'')+'">'+
        (has?p.toFixed(1)+'%':money(c.revenue))+'</b>'+
        '<span>'+esc(has?money(c.revenue):(c.units+' units'))+'</span></div>'+
    '</div>';
  }).join('');
}

function renderPace(){
  var t=DATA.totals, m=DATA.meta||{};
  var day=n(m.day), days=n(m.days)||30, left=Math.max(0,days-day);
  var run = day>0 ? t.revenue/day : 0;
  var proj= run*days;
  var gap = t.target - t.revenue;
  var need= left>0 ? gap/left : gap;
  var p=pct(t.revenue,t.target), e=expectedPct();

  document.getElementById('paceBd').innerHTML='<div class="pacegrid">'+[
    card('Days left', left+' of '+days, day+' done'),
    card('Run rate', money(run)+'/day', 'need '+money(Math.max(0,need))+'/day'),
    card('Projected', money(proj), proj>=t.target?'clears target':'short by '+money(Math.max(0,t.target-proj))),
    card('Against pace', (p-e>=0?'+':'')+(p-e).toFixed(1)+' pts', 'at '+p.toFixed(1)+'%, pace '+e.toFixed(0)+'%',
         p-e>=0?'ahead':'behind')
  ].join('')+'</div>';
}

/* A month-to-date total reads the same whether it arrived steadily or
   all in one week - which is the difference between a team that is fine
   and one about to miss. The best day is marked so there is something to
   beat, and today is marked so it can be seen being beaten. */
function renderDay(){
  var days=DATA.byDay||[], bd=document.getElementById('dayBd'), sub=document.getElementById('daySub');
  if(days.length<2){ bd.innerHTML='<div class="empty">Not enough days yet</div>'; sub.textContent=''; return; }
  var max=0, best=-1;
  days.forEach(function(x,i){ if(x.rev>max){ max=x.rev; best=i; } });
  if(max<=0){ bd.innerHTML='<div class="empty">No revenue recorded yet this month</div>'; sub.textContent=''; return; }
  var todayNo=n((DATA.meta||{}).day);
  sub.textContent = best>=0 ? ('best: day '+days[best].d+' at '+money(max)) : '';
  bd.innerHTML='<div class="spark">'+days.map(function(x,i){
    var h=Math.max(0,Math.round(x.rev/max*100));
    var cls = x.rev<=0 ? 'zero' : (i===best ? 'best' : (x.d===todayNo ? 'today' : ''));
    var lab = (x.d===1||x.d%5===0||x.d===todayNo) ? x.d : '';
    return '<div class="bar '+cls+'" title="'+x.d+': '+money(x.rev)+'">'+
             '<i style="height:'+(x.rev<=0?2:h)+'%"></i>'+
             (lab?'<b>'+lab+'</b>':'')+'</div>';
  }).join('')+'</div>';
}

function card(k,v,note,cl){
  return '<div class="pcard"><div class="k">'+esc(k)+'</div>'+
    '<div class="v '+(cl||'')+'">'+esc(v)+'</div><div class="n">'+esc(note)+'</div></div>';
}

/* =====================================================================
   RIGHT COLUMN - managers

   All of them, every time. The old board hid rows five and up whenever
   this block happened to be small, so four of your nine managers were
   invisible for most of the day depending on where the rotation was.
   ===================================================================== */
function renderManagers(){
  var list=document.getElementById('mgrList');
  if(!DATA.managers.length){ list.innerHTML='<div class="empty">No manager data</div>'; return; }
  var withT=DATA.managers.filter(function(m){return m.target>0;});
  var noT  =DATA.managers.filter(function(m){return !(m.target>0);});

  var html=withT.map(function(m,i){
    var p=attain(m), rk=i+1;
    return '<div class="mrow '+teamClass(m.team)+(rk<=3?' p'+rk:'')+
      '" style="animation-delay:'+(rk*35)+'ms">'+
      '<div class="rk">'+rk+'</div>'+
      '<div class="who"><b>'+esc(m.name)+'</b><span>'+
        esc(joinDot(m.city, m.team, m.agents+' agents'))+'</span></div>'+
      '<div class="bar">'+barHTML(p)+'</div>'+
      '<div class="fig"><b class="'+paceClass(p)+'">'+p.toFixed(1)+'%</b>'+
        '<span>'+money(m.revenue)+'</span></div>'+
    '</div>';
  }).join('');

  /* Listed, not dropped. A manager who vanishes from the wall is a
     manager nobody asks about. */
  html += noT.map(function(m){
    return '<div class="mrow notgt '+teamClass(m.team)+'">'+
      '<div class="rk">—</div>'+
      '<div class="who"><b>'+esc(m.name)+'</b><span>'+
        esc(joinDot(m.city, m.agents+' agents'))+' · no target set</span></div>'+
      '<div class="bar"></div>'+
      '<div class="fig"><b>'+money(m.revenue)+'</b><span>'+m.units+' units</span></div>'+
    '</div>';
  }).join('');

  list.innerHTML=html;
}

/* =====================================================================
   TICKER
   ===================================================================== */
function buildTicker(){
  var r=DATA.recent||[], parts=[], lab='Just Closed';
  if(r.length){
    r.forEach(function(x){
      parts.push('<span class="ti"><em>CLOSED</em><b>'+esc(x.name)+'</b>'+
        '<span class="amt">'+money(x.amt)+'</span>'+
        '<span class="mt">'+esc(joinDot(x.city,x.team,x.manager))+'</span>'+
        '<span class="dv">|</span></span>');
    });
  } else {
    /* No closes yet. Say that plainly rather than running a bar of
       month-to-date zeroes, which is what it used to do - a row of
       "0u" beside every name reads as a broken feed, not a quiet month. */
    lab='Month To Date';
    var live=DATA.agents.filter(function(a){return a.revenue>0;}).slice(0,12);
    if(live.length){
      live.forEach(function(a){
        parts.push('<span class="ti"><em>MTD</em><b>'+esc(a.name)+'</b>'+
          '<span class="amt">'+money(a.revenue)+'</span>'+
          '<span class="mt">'+esc(joinDot(a.city,a.manager))+' · '+a.units+'u</span>'+
          '<span class="dv">|</span></span>');
      });
    } else {
      parts.push('<span class="ti"><span class="mt">'+
        'No sales recorded yet this month</span></span>');
    }
  }
  document.querySelector('#tickLabText').textContent=lab;
  var html=parts.join('');
  var tr=document.getElementById('tickTrack');
  tr.innerHTML = html + html;      /* doubled, so -50% loops seamlessly */
  sizeTicker();
}

/* Speed as pixels per second, measured off the real width.
   The old board ran the whole loop in a fixed 64 seconds, so a busy day
   with forty closes scrolled several times faster than a quiet one with
   six - unreadable exactly when it mattered most. */
function sizeTicker(){
  var tr=document.getElementById('tickTrack');
  if(!tr) return;
  requestAnimationFrame(function(){
    var half = tr.scrollWidth/2;
    if(!(half>0)) return;
    var secs = half / Math.max(20, CONFIG.TICKER_PX_PER_SEC);
    tr.style.animationDuration = secs.toFixed(1)+'s';
  });
}

/* =====================================================================
   NEW ON THE FLOOR

   A cutaway, not a mode. Every JOINER_EVERY minutes it takes the screen
   for a few cards, then hands it straight back. It stops by itself after
   JOINER_UNTIL so nobody has to remember to turn it off, and ?joiners=0
   kills it immediately.
   ===================================================================== */
function joinersLive(){
  if(!CONFIG.JOINERS) return false;
  if(!JOINERS || !JOINERS.length) return false;
  var until = CONFIG.JOINER_UNTIL;
  if(until){
    var d=new Date(until+'T23:59:59');
    if(!isNaN(d.getTime()) && Date.now() > d.getTime()) return false;
  }
  return true;
}

function scheduleJoiners(){
  if(!joinersLive()) return;
  clearTimeout(jcTimer);
  jcTimer=setTimeout(function(){
    playJoiners(function(){ scheduleJoiners(); });
  }, Math.max(2,CONFIG.JOINER_EVERY)*60000);
}

function playJoiners(done){
  if(!JOINERS || !JOINERS.length){ if(done) done(); return; }
  var shown=0, per=Math.max(1,CONFIG.JOINER_PER_RUN), secs=Math.max(4,CONFIG.JOINER_SECS);
  var el=document.getElementById('joinCard');

  function next(){
    if(shown>=per){ el.className=''; if(done) done(); return; }
    var j=JOINERS[jcIdx % JOINERS.length];
    jcIdx++; shown++;
    showJoiner(j, (jcIdx-1) % JOINERS.length);
    setTimeout(next, secs*1000);
  }
  next();
}

function showJoiner(j, idx){
  var el=document.getElementById('joinCard');
  var img=document.getElementById('jcPhoto');
  var ini=document.getElementById('jcInitials');

  document.getElementById('jcName').textContent  = j.n || '';
  document.getElementById('jcRole').textContent  = j.r || 'Sales Consultant';
  document.getElementById('jcQuote').textContent = j.q || '';
  document.getElementById('jcCount').textContent =
    'Joiner ' + (idx+1) + ' of ' + JOINERS.length + '  ·  Hyderabad';

  /* Initials behind the photo, so a file that fails to load leaves a
     designed card rather than a grey rectangle. */
  ini.textContent = (j.n||'?').split(/\s+/).map(function(w){return w.charAt(0);})
                      .join('').slice(0,2).toUpperCase();
  ini.style.display='none';
  img.style.display='block';
  img.onerror=function(){ img.style.display='none'; ini.style.display='flex'; };
  img.alt = j.n || '';
  img.src = CONFIG.JOINER_BASE + (j.p||'');

  /* restart the slow zoom for each card */
  img.style.animation='none'; void img.offsetWidth; img.style.animation='';

  el.className='on';
}
