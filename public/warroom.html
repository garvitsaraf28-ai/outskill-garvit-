<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Outskill — Sales War Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap"/>
<style>
/* =====================================================================
   OUTSKILL SALES WAR ROOM
   Built for a 1920x1080 stage, scaled to fit any TV. Never scrolls,
   never clips. See the JS CONFIG block for everything tunable.
   ===================================================================== */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:      #06080a;
  --bg2:     #0b0f12;
  --panel:   rgba(255,255,255,0.035);
  --line:    rgba(255,255,255,0.10);
  --lime:    #c2ee45;
  --lime-dk: #8fb62b;
  --gold:    #ffd76e;
  --silver:  #d7dee6;
  --bronze:  #e0a06a;
  --teal:    #4dd8c0;
  --rose:    #ff6b8a;
  --white:   #f2f6ef;
  --muted:   #7d8a93;
  --dim:     #4d585f;
}

html, body {
  width: 100%; height: 100%;
  background: var(--bg);
  overflow: hidden;
  /* Belt and braces: the stage is a fixed 1920 wide and scaled down, so a
     browser that decides to inflate small text on a narrow viewport would
     reflow a layout that is meant to be rigid. */
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  font-family: 'Archivo', system-ui, -apple-system, sans-serif;
  color: var(--white);
  -webkit-font-smoothing: antialiased;
}

/* ---------- the stage: everything is designed at exactly 1920x1080 ---------- */
#viewport { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #000; }
#stage {
  position: relative;
  width: 1920px; height: 1080px;
  /* The stage must stay exactly 1920x1080 and be SCALED to fit. As a flex
     item it was being shrunk instead: at a 390px viewport it laid out 390px
     wide, so the design reflowed and overflowed rather than shrinking as a
     whole. Every screen narrower than 1920 - which is most laptops - was
     laying out wrong. flex:none stops the shrink; transform does the fitting. */
  flex: none;
  transform-origin: center center;
  background:
    radial-gradient(1200px 700px at 50% -10%, rgba(194,238,69,0.07), transparent 70%),
    radial-gradient(900px 600px at 100% 110%, rgba(77,216,192,0.05), transparent 70%),
    var(--bg);
  overflow: hidden;
}
#stage::after {  /* film grain, keeps large flat areas from banding on TVs */
  content: ''; position: absolute; inset: 0; pointer-events: none; opacity: .035; z-index: 60;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}

/* ---------- persistent chrome ---------- */
#topbar {
  position: absolute; top: 0; left: 0; right: 0; height: 96px; z-index: 40;
  display: flex; align-items: center; padding: 0 64px; gap: 32px;
  border-bottom: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(0,0,0,0.55), rgba(0,0,0,0));
}
.brand { display: flex; align-items: baseline; gap: 14px; }
.brand .mark { font-family: 'Anton', 'Archivo Black', Impact, sans-serif; font-size: 34px; letter-spacing: 1px; color: var(--lime); }
.brand .sub  { font-size: 15px; letter-spacing: 5px; text-transform: uppercase; color: var(--muted); font-weight: 600; }

#clockwrap { margin-left: auto; display: flex; align-items: center; gap: 40px; }
.period { text-align: right; }
.period .big { font-family: 'Anton', 'Archivo Black', Impact, sans-serif; font-size: 30px; letter-spacing: .5px; }
.period .small { font-size: 14px; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); margin-top: 2px; }

#live { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border: 1px solid var(--line); border-radius: 100px; background: var(--panel); }
#dot { width: 11px; height: 11px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 14px var(--lime); animation: pulse 2.2s ease-in-out infinite; }
#live.stale #dot { background: var(--gold); box-shadow: 0 0 14px var(--gold); }
#live.down  #dot { background: var(--rose); box-shadow: 0 0 14px var(--rose); animation: none; }
#livetext { font-family: 'Space Mono', monospace; font-size: 14px; letter-spacing: 1px; color: var(--muted); }
#livetext b { color: var(--white); font-weight: 700; }
@keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .45; transform: scale(.82); } }

#botbar { position: absolute; bottom: 0; left: 0; right: 0; height: 64px; z-index: 40; display: flex; align-items: center; padding: 0 64px; gap: 22px; border-top: 1px solid var(--line); }
#screenname { font-size: 14px; letter-spacing: 4px; text-transform: uppercase; color: var(--muted); font-weight: 700; min-width: 300px; }
#dots { display: flex; gap: 8px; margin-left: auto; }
#dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); display: block; transition: all .3s; }
#dots i.on { background: var(--lime); width: 26px; border-radius: 4px; }
#progress { position: absolute; bottom: 0; left: 0; height: 3px; background: var(--lime); width: 0%; box-shadow: 0 0 10px var(--lime); }

/* ---------- screens ---------- */
.screen {
  position: absolute; top: 96px; left: 0; right: 0; bottom: 64px; z-index: 10;
  padding: 44px 64px 28px; opacity: 0; pointer-events: none;
  transform: translateY(22px) scale(.995);
  transition: opacity .55s cubic-bezier(.2,.7,.2,1), transform .55s cubic-bezier(.2,.7,.2,1);
  display: flex; flex-direction: column; overflow: hidden;
}
.screen.on { opacity: 1; transform: none; pointer-events: auto; }

.eyebrow { font-size: 15px; letter-spacing: 6px; text-transform: uppercase; color: var(--lime); font-weight: 700; margin-bottom: 10px; }
h1.big { font-family: 'Anton', 'Archivo Black', Impact, sans-serif; font-size: 78px; line-height: .96; letter-spacing: -.5px; }
h1.big .accent { color: var(--lime); }
.sub { font-size: 20px; color: var(--muted); margin-top: 10px; }

/* number blocks */
.statrow { display: flex; gap: 22px; }
.stat { flex: 1; background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 24px 28px; }
.stat .lbl { font-size: 14px; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.stat .val { font-family: 'Anton', 'Archivo Black', Impact, sans-serif; font-size: 62px; line-height: 1.04; margin-top: 8px; letter-spacing: -.5px; }
.stat .val.sm { font-size: 48px; }
.stat.hero { background: linear-gradient(135deg, rgba(194,238,69,0.16), rgba(194,238,69,0.04)); border-color: rgba(194,238,69,0.42); }
.stat.hero .val { color: var(--lime); }
.stat .foot { font-size: 15px; color: var(--muted); margin-top: 6px; }
/* The spot board's three headline numbers stretch to fill the height they
   are given, so the figures dominate rather than the reference material. */
.spotstats .stat { display: flex; flex-direction: column; justify-content: center; }

/* attainment bar */
.bar { height: 16px; border-radius: 10px; background: rgba(255,255,255,0.07); overflow: hidden; position: relative; }
.bar > i { display: block; height: 100%; border-radius: 10px; background: linear-gradient(90deg, var(--lime-dk), var(--lime)); width: 0%; transition: width 1.1s cubic-bezier(.2,.7,.2,1); box-shadow: 0 0 16px rgba(194,238,69,.45); }
.bar.thin { height: 10px; }
.bar.gold > i { background: linear-gradient(90deg, #c69a35, var(--gold)); box-shadow: 0 0 16px rgba(255,215,110,.45); }

/* podium */
.podium { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
.pod { border-radius: 22px; padding: 26px 26px 22px; border: 1px solid var(--line); background: var(--panel);
  position: relative; overflow: hidden; display: flex; flex-direction: column; }
.pod .medal { font-size: 40px; line-height: 1; }
.pod .nm { font-family: 'Anton', 'Archivo Black', Impact, sans-serif; font-size: 40px; line-height: 1.02; margin-top: 12px; letter-spacing: -.3px; }
.pod .meta { font-size: 15px; color: var(--muted); margin-top: 6px; }
.pod .rev { font-family: 'Anton', 'Archivo Black', Impact, sans-serif; font-size: 46px; margin-top: 14px; color: var(--lime); }
.pod .u { font-size: 16px; color: var(--muted); margin-top: 2px; }
.pod.gold { background: linear-gradient(150deg, rgba(255,215,110,0.20), rgba(255,215,110,0.03)); border-color: rgba(255,215,110,0.55); box-shadow: 0 0 50px rgba(255,215,110,.10) inset; }
.pod.gold .rev { color: var(--gold); }
.pod.gold::before { content:''; position:absolute; inset:-40% -20% auto; height:70%; background: radial-gradient(circle, rgba(255,215,110,.22), transparent 70%); pointer-events:none; }
.pod.silver { border-color: rgba(215,222,230,0.34); }
.pod.bronze { border-color: rgba(224,160,106,0.34); }
.pod.sm { padding: 20px 22px 18px; }
.pod.sm .medal { font-size: 30px; }
.pod.sm .nm { font-size: 30px; margin-top: 8px; }
.pod.sm .rev { font-size: 38px; margin-top: 10px; }
.pod.sm .meta, .pod.sm .u { font-size: 14px; }

/* leaderboard rows */
/* Rows share out the height they are given, so a board of 5 and a board of
   12 both fill the screen instead of leaving a hole under the last row.
   The min/max keep them readable at 10m and stop 3 rows becoming slabs. */
.lb { display: flex; flex-direction: column; gap: 8px; flex: 1; min-height: 0; overflow: hidden; justify-content: center; }
.lb > .row { flex: 1 1 auto; min-height: 62px; max-height: 96px; }
.lb > .row.head, .lb > .more { flex: none; }
.row {
  display: grid; align-items: center; gap: 18px;
  grid-template-columns: 74px 1fr 190px 150px 110px 230px;
  padding: 13px 20px; border-radius: 14px; background: var(--panel); border: 1px solid transparent;
}
.row.head { background: none; border: none; padding-top: 0; padding-bottom: 6px; }
.row.head span { font-size: 13px; letter-spacing: 3px; text-transform: uppercase; color: var(--dim); font-weight: 700; }
.row.lead { background: linear-gradient(90deg, rgba(255,215,110,0.16), rgba(255,215,110,0.02)); border-color: rgba(255,215,110,0.42); }
.rk { font-family: 'Anton', 'Archivo Black', Impact, sans-serif; font-size: 30px; color: var(--muted); }
.row.lead .rk { color: var(--gold); }
.nm2 { font-size: 26px; font-weight: 700; letter-spacing: -.2px; display: flex; align-items: center; gap: 12px; min-width: 0; }
.nm2 .tx { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nm2 .mv { flex: none; }
.tag { font-size: 13px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 100px; padding: 4px 11px; font-weight: 700; }
.mv { font-family: 'Space Mono', monospace; font-size: 15px; font-weight: 700; padding: 3px 9px; border-radius: 6px; }
.mv.up { color: #0b0f12; background: var(--lime); }
.mv.down { color: var(--rose); background: rgba(255,107,138,.12); }
.mv.new { color: #0b0f12; background: var(--gold); }
.meta2 { font-size: 16px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.more { font-size: 15px; letter-spacing: 3px; text-transform: uppercase; color: var(--dim); font-weight: 700; padding: 6px 20px 0; }
.num { font-family: 'Anton', 'Archivo Black', Impact, sans-serif; font-size: 32px; text-align: right; }
.num.lime { color: var(--lime); }
.pct { font-family: 'Anton', 'Archivo Black', Impact, sans-serif; font-size: 26px; text-align: right; color: var(--muted); }

/* target-battle columns: blocks spread over whatever height they are given,
   so 3 cities and 7 managers both reach the bottom of the screen */
.barwrap { display: flex; flex-direction: column; min-height: 0; }
.barcol { display: flex; flex-direction: column; justify-content: space-evenly; flex: 1; min-height: 0; overflow: hidden; }

/* two-column head to head */
.h2h { display: grid; grid-template-columns: 1fr 130px 1fr; gap: 26px; align-items: stretch; flex: 1; min-height: 0; }
.side { border-radius: 24px; border: 1px solid var(--line); background: var(--panel); padding: 38px 40px; display: flex; flex-direction: column; justify-content: center; }
.side.win { background: linear-gradient(150deg, rgba(194,238,69,0.14), rgba(194,238,69,0.02)); border-color: rgba(194,238,69,0.45); }
.side .t { font-family: 'Anton', 'Archivo Black', Impact, sans-serif; font-size: 56px; letter-spacing: -.5px; }
.side .r { font-family: 'Anton', 'Archivo Black', Impact, sans-serif; font-size: 104px; line-height: 1; margin: 16px 0 6px; }
.side.win .r { color: var(--lime); }
.vs { display: flex; align-items: center; justify-content: center; font-family: 'Anton', 'Archivo Black', Impact, sans-serif; font-size: 44px; color: var(--dim); }

/* award cards */
.awards { display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 1fr; gap: 18px; flex: 1; min-height: 0; }
.award { border-radius: 20px; border: 1px solid var(--line); background: var(--panel); padding: 24px 26px;
  display: flex; flex-direction: column; justify-content: center; gap: 16px; overflow: hidden; position: relative; }
.award .k { font-size: 13px; letter-spacing: 3px; text-transform: uppercase; color: var(--lime); font-weight: 800; }
.award .who { font-family: 'Anton', 'Archivo Black', Impact, sans-serif; font-size: 42px; line-height: 1.05; margin-top: 10px; letter-spacing: -.3px; }
.award .v { font-family: 'Anton', 'Archivo Black', Impact, sans-serif; font-size: 34px; color: var(--gold); }
.award .n { font-size: 16px; color: var(--muted); margin-top: 4px; }
.award .ic { font-size: 30px; position: absolute; top: 20px; right: 22px; opacity: .85; }

/* full-bleed message screens */
.center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 26px; }
.center .kicker { font-size: 17px; letter-spacing: 8px; text-transform: uppercase; color: var(--lime); font-weight: 800; }
.center .line { font-family: 'Anton', 'Archivo Black', Impact, sans-serif; font-size: 92px; line-height: 1.04; max-width: 1560px; letter-spacing: -1px; }
.center .line .accent { color: var(--lime); }
.center .line.sm { font-size: 68px; }
.center .note { font-size: 24px; color: var(--muted); max-width: 1200px; }

/* initiative */
.offer { border-radius: 28px; border: 1px solid rgba(255,215,110,.5); background: linear-gradient(150deg, rgba(255,215,110,.14), rgba(255,215,110,.02)); padding: 46px 54px; display: flex; flex-direction: column; gap: 18px; flex: 1; justify-content: center; }
.offer .t { font-family: 'Anton', 'Archivo Black', Impact, sans-serif; font-size: 76px; line-height: 1.02; color: var(--gold); letter-spacing: -.5px; }
.offer .d { font-size: 30px; line-height: 1.45; max-width: 1400px; }
.offer .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 10px; }
.offer .cell .k { font-size: 13px; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); font-weight: 800; }
.offer .cell .v { font-size: 26px; font-weight: 700; margin-top: 6px; }

/* flash / celebration overlay */
#flash { position: absolute; inset: 0; z-index: 55; display: none; align-items: center; justify-content: center; background: rgba(6,8,10,.86); backdrop-filter: blur(6px); }
#flash.on { display: flex; animation: flashin .5s ease; }
@keyframes flashin { from { opacity: 0; transform: scale(1.04); } to { opacity: 1; transform: none; } }
#flash .inner { text-align: center; }
#flash .k { font-size: 20px; letter-spacing: 10px; text-transform: uppercase; color: var(--gold); font-weight: 800; }
#flash .n { font-family: 'Anton', 'Archivo Black', Impact, sans-serif; font-size: 128px; line-height: 1.02; margin-top: 14px; }
#flash .v { font-family: 'Anton', 'Archivo Black', Impact, sans-serif; font-size: 54px; color: var(--lime); margin-top: 10px; }

/* preview / banner chips */
/* Banner lives in the bottom bar so it can never sit on top of a number. */
#banner { background: rgba(255,215,110,.15); border: 1px solid rgba(255,215,110,.5); color: var(--gold);
  padding: 6px 16px; border-radius: 100px; font-size: 13px; letter-spacing: 3px;
  text-transform: uppercase; font-weight: 800; display: none; white-space: nowrap; }
#banner.on { display: block; }

/* A TV has no mouse, so the only control on screen hides itself until one moves. */
#fsbtn { position: fixed; left: 18px; bottom: 18px; z-index: 90; background: rgba(255,255,255,.10); color: #fff;
  border: 1px solid rgba(255,255,255,.25); border-radius: 100px; padding: 10px 18px; font-family: inherit;
  font-size: 13px; letter-spacing: 2px; text-transform: uppercase; cursor: pointer;
  opacity: 0; pointer-events: none; transition: opacity .25s; }
#fsbtn.show { opacity: .8; pointer-events: auto; }
#fsbtn:hover { opacity: 1; }
</style>
</head>
<body>

<div id="viewport">
  <div id="stage">

    <div id="topbar">
      <div class="brand"><span class="mark">OUTSKILL</span><span class="sub" id="boardName">Sales War Room</span></div>
      <div id="clockwrap">
        <div class="period">
          <div class="big" id="periodBig">—</div>
          <div class="small" id="periodSmall">month to date</div>
        </div>
        <div id="live"><span id="dot"></span><span id="livetext">connecting…</span></div>
      </div>
    </div>

    <div id="screens"></div>

    <div id="flash"><div class="inner">
      <div class="k" id="flashK"></div>
      <div class="n" id="flashN"></div>
      <div class="v" id="flashV"></div>
    </div></div>

    <div id="botbar">
      <div id="screenname">—</div>
      <div id="banner"></div>
      <div id="dots"></div>
    </div>
    <div id="progress"></div>

  </div>
</div>

<button id="fsbtn" onclick="goFull()">Full screen</button>

<script>
/* =====================================================================
   CONFIG — everything tunable lives here.
   Query-string overrides: ?api=...&rotate=12&refresh=30&sound=1&screens=overall,managers
   ===================================================================== */
var Q = new URLSearchParams(location.search);

/* Which board this screen is. 'spot' = the running contest only. */
var BOARD = (Q.get('board') || 'main').toLowerCase();

var CONFIG = {
  /* The feed. Baked in so ONE address works on every screen - TV, desktop,
     laptop, phone - with nothing to append and nothing to remember:
         https://outskill-garvit.vercel.app/warroom
     ?api=<other /exec URL> still overrides it, for testing a second feed
     without touching this file. */
  API_URL: Q.get('api') ||
    'https://script.google.com/macros/s/AKfycbzKIf-nwL4RLwhwfhSQTMo-pyjEeonxxdTexUecEYdKOUnkBNIrlhqPJTPbII1iZcxe6g/exec?feed=warroom',

  REFRESH_SECONDS: +(Q.get('refresh') || 30),   // how often we poll for new data
  ROTATE_SECONDS:  +(Q.get('rotate')  || 13),   // how long each screen is held
  INTERSTITIAL_SECONDS: 9,                      // the short creative screens
  SOUND: Q.get('sound') === '1',                // default OFF: many TVs in one room

  /* Screen rotation. Remove or reorder freely. "city:X" renders one city. */
  /* TWO BOARDS, TWO LINKS.
       /warroom              the month - revenue, cities, managers, agents
       /warroom?board=spot   the running contest, and nothing else
     A contest screen buried in a sixteen-screen rotation is glanced at once
     an hour. On its own screen it is the thing people look up at. */
  SCREENS: (Q.get('screens') ? Q.get('screens').split(',')
    : BOARD === 'spot'
      ? ['spotoffer', 'spotboard', 'spotsplit']
      : [
          'overall',
          'city:Bangalore',
          'city:Hyderabad',
          'city:Bhubaneswar',
          'interstitial',
          'managers',
          'agents',
          'teams',
          'targetbattle',
          'awards',
          'interstitial'
        ]),

  /* THE RUNNING CONTEST - the rules screen.
     The dates and the unit counting live in WR_CONTEST in war-room.gs;
     this is what the floor reads. Set active:false when it is over. */
  INITIATIVE: {
    active: true,
    title: 'THE UNIT RUSH IS ON',
    detail: 'This weekend we count UNITS, not revenue. Booking or full amount = 1 unit. Just close.',
    eligibility: 'Accelerator sales only',
    period: 'Sat 12 - Mon 14 Sept - 72 hours',
    reward: 'Up to no cap - see the ladder',
    goalRevenue: 0        // optional: shows a progress bar toward this number
  },

  /* The payout ladder. Keep it in step with the message on Slack.
     Below `perUnitFrom` the payout is looked up in `steps`; from there
     on it is `perUnit` for every unit, which is what makes 4 -> 5 double. */
  LADDER: {
    steps: { 2: 1000, 3: 1500, 4: 2500 },
    perUnitFrom: 5,
    perUnit: 1000,
    rules: [
      'ONLY Accelerator sales count. Bootcamp sales from workshop leads do NOT count.',
      'Zero tolerance: mis-selling or false commitments means immediate termination.'
    ]
  },

  /* Milestones celebrated when company revenue crosses them. */
  MILESTONES: [500000, 1000000, 2500000, 5000000, 7500000, 10000000, 25000000, 50000000, 75000000, 100000000],

  LEADERBOARD_ROWS: 9,       // rows under the podium on city/agent screens
  TZ_LABEL: 'IST'
};

/* =====================================================================
   SAMPLE PAYLOAD — used only until API_URL is reachable, and clearly
   flagged PREVIEW on screen so it can never be mistaken for live data.
   Shape here IS the contract WarRoom.gs implements.
   ===================================================================== */
var SAMPLE = {
  ok: true, sample: true,
  meta: { month: 'September 2026', day: 12, days: 30, generatedAt: Date.now(), windowLabel: 'MTD (1–12)' },
  totals: { target: 52675000, revenue: 4865206, units: 41, agents: 90 },
  teams: [
    { name: 'International', target: 28000000, revenue: 2937505, units: 19 },
    { name: 'India',         target: 24675000, revenue: 1927701, units: 22 }
  ],
  cities: [
    { name: 'Bangalore',   target: 15850000, revenue: 2493561, units: 17, agents: 20 },
    { name: 'Hyderabad',   target: 19625000, revenue: 1724680, units: 17, agents: 42 },
    { name: 'Bhubaneswar', target: 17200000, revenue:  646965, units:  7, agents: 28 }
  ],
  managers: [
    { name: 'Deepika M',      city: 'Bangalore',   team: 'International', target: 8250000,  revenue: 1506505, units: 6,  agents: 7 },
    { name: 'Saeed',          city: 'Hyderabad',   team: 'International', target: 14000000, revenue: 1228000, units: 11, agents: 12 },

   STATE
   ===================================================================== */
var DATA = null;            // last VALID payload. Never cleared on failure.
var LAST_OK = 0;            // ms timestamp of last good fetch - is the CONNECTION alive
var DATA_AT = 0;            // when the feed BUILT these numbers - how old the DATA is
var USING_SAMPLE = true;
var FAILS = 0;
var prevAgentRank = {};     // client-side movement, a fallback if the API omits prevRank
var seenMilestone = 0;
var lastSig = '';
var screenIdx = -1, rotTimer = null, progTimer = null;
var running = false;   // false while a setup / outage screen is up
var interIdx = -1;                          // advanced on arrival, not on every repaint
var agentFrom = 0, agentShown = 0, agentTotal = 0;   // rolling window over the agent list

/* =====================================================================
   UTIL
   ===================================================================== */
function n(x) {
  if (typeof x === 'string') x = x.replace(/,/g, '');
  x = Number(x); return isFinite(x) ? x : 0;
}
function s(x) { return x == null ? '' : String(x); }
/* joins the parts that exist, so a missing city never prints "undefined ·" */
function joinDot() {
  return Array.prototype.slice.call(arguments).filter(function (v) { return v !== '' && v != null; }).join(' · ');
}
function money(v) {                       // 48.65 L / 5.27 cr, the way the floor reads it
  v = n(v); var a = Math.abs(v);
  if (a >= 10000000) return (v / 10000000).toFixed(2) + ' cr';
  if (a >= 100000)   return (v / 100000).toFixed(2) + ' L';
  return Math.round(v).toLocaleString('en-IN');
}
function moneyShort(v) { v = n(v); var a = Math.abs(v);
  if (a === 0) return '0';
  if (a >= 10000000) return (v / 10000000).toFixed(2) + 'cr';
  if (a < 100000) return Math.round(v).toLocaleString('en-IN');
  return (v / 100000).toFixed(1) + 'L'; }
function pct(a, b) { b = n(b); return b > 0 ? (n(a) / b) * 100 : 0; }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
  return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); }
function el(html) { var d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstChild; }

/* count-up on the big numbers, cheap and cancellable */
function countUp(node, to, fmt, ms) {
  if (!node) return;
  var from = 0, t0 = performance.now(); ms = ms || 900;
  if (node._raf) cancelAnimationFrame(node._raf);
  function step(t) {
    var p = Math.min((t - t0) / ms, 1), e = 1 - Math.pow(1 - p, 3);
    node.textContent = fmt(from + (to - from) * e);
    if (p < 1) node._raf = requestAnimationFrame(step); else node._raf = null;
  }
  node._raf = requestAnimationFrame(step);
}

/* =====================================================================
   STAGE SCALING — the whole reason this never clips on a TV
   ===================================================================== */
function fit() {
  var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
  var st = document.getElementById('stage');
  st.style.transform = 'scale(' + s + ')';
}
window.addEventListener('resize', fit);

function goFull() {
  var e = document.documentElement;
  if (document.fullscreenElement) document.exitFullscreen();
  else if (e.requestFullscreen) e.requestFullscreen().catch(function () {});
}
document.addEventListener('keydown', function (e) {
  if (e.key === 'f' || e.key === 'F') goFull();
  if (e.key === 'ArrowRight') { clearTimeout(rotTimer); next(); }
  if (e.key === 'ArrowLeft')  { clearTimeout(rotTimer); screenIdx--; show(); }
});

/* =====================================================================
   DATA LAYER — JSONP, because an Apps Script Web App is not reliably
   CORS-fetchable from another origin. A <script> tag always works.
   ===================================================================== */
var jsonpSeq = 0;
function loadData() {
  if (!CONFIG.API_URL) { stateScreen('not-configured'); return; }

  var cb = '__wr' + (++jsonpSeq);
  var done = false;
  var s = document.createElement('script');
  var url = CONFIG.API_URL + (CONFIG.API_URL.indexOf('?') > -1 ? '&' : '?') +
            'callback=' + cb + '&t=' + Date.now();

  /* A cold build on the real workbook takes ~14s (tens of thousands of
     payment rows). Most polls hit the feed's cache and come back instantly,
     but the one that rebuilds must not be cut off at the knees. */
  var timer = setTimeout(function () { if (!done) { cleanup(); fail(); } }, 30000);

  window[cb] = function (payload) {
    done = true; clearTimeout(timer); cleanup();
    if (payload && payload.ok) { applyData(payload, false); }
    else fail();
  };
  function cleanup() {
    try { delete window[cb]; } catch (e) { window[cb] = undefined; }
    if (s.parentNode) s.parentNode.removeChild(s);
  }
  s.onerror = function () { if (!done) { clearTimeout(timer); cleanup(); fail(); } };
  s.src = url;
  document.head.appendChild(s);
}

/* A board with no real data must SAY so. It must never fall back to
   plausible-looking numbers - a wrong figure read confidently off a wall
   is worse than an obviously broken screen, because nobody checks it. */
function fail() {
  FAILS++;
  if (!DATA) { stateScreen('unreachable'); return; }
  paintLive();   // we have real figures; keep them up, labelled with their age
}

/* Full-screen, unmistakable, and it stops the rotation. */

              'display:inline-block;text-decoration:underline">' +
              esc(CONFIG.API_URL) + '</a></div>' +
              '<div style="margin-top:14px;font-size:18px">' +
              (FAILS > 0
                 ? ('No answer after ' + FAILS + ' attempt' + (FAILS === 1 ? '' : 's') + '. Retrying every ')
                 : 'Trying now, then every ') +

function applyData(payload, isSample) {
  // remember previous ranks so we can show movement even if the API omits it
  if (DATA && DATA.agents) {
    prevAgentRank = {};
    DATA.agents.forEach(function (a, i) { prevAgentRank[a.name] = i + 1; });
  }
  DATA = normalise(payload);
  USING_SAMPLE = !!isSample;
  if (!isSample) {
    LAST_OK = Date.now(); FAILS = 0;
    /* The feed caches for four minutes, so a fetch that just succeeded can
       carry numbers built a few minutes ago. Show the age of the NUMBERS,
       not of the request - otherwise the board claims to be 2 seconds old
       when it is really 3 minutes old, which is the one thing a leaderboard
       must not lie about. Server clock, so ignore it if it looks skewed. */
    var built = n(DATA.meta && DATA.meta.generatedAt);
    var skew = Math.abs(Date.now() - built);
    DATA_AT = (built > 0 && skew < 86400000) ? built : LAST_OK;
  }
  document.getElementById('banner').className = isSample ? 'on' : '';
  document.getElementById('banner').textContent = isSample
    ? (CONFIG.API_URL ? 'Preview data — live feed unreachable' : 'Preview data — set ?api= to go live')
    : '';
  checkMilestone();
  paintChrome();

  /* Only repaint when the numbers actually moved. A poll that returns the
     same figures should not make the board flicker and re-animate. */
  /* First real payload after a setup or outage screen: start the rotation. */
  if (!running) { running = true; screenIdx = 0; lastSig = signature(DATA); show(); return; }

  var sig = signature(DATA);
  if (sig !== lastSig) { lastSig = sig; render(); }
}

function signature(d) {
  return [d.totals.revenue, d.totals.units, d.totals.target, d.cities.length, d.managers.length,
          d.contest.active ? d.contest.totalUnits : 'x']
    .concat(d.agents.slice(0, 40).map(function (a) { return a.name + ':' + a.revenue + ':' + a.units; }))
    .concat((d.contest.agents || []).slice(0, 40).map(function (a) { return 'c' + a.name + ':' + a.units; }))
    .join('|');
}

/* Defensive: tolerate missing sections, nulls, zero targets, bad rows. */
function normalise(p) {
  p = p || {};
  var out = {
    meta: p.meta || {},
    totals: p.totals || {},
    teams: (p.teams || []).filter(Boolean),
    cities: (p.cities || []).filter(function (c) { return c && c.name; }),
    managers: (p.managers || []).filter(function (m) { return m && m.name; }),
    agents: (p.agents || []).filter(function (a) { return a && a.name; }),
    contest: p.contest || { active: false },
    sample: !!p.sample
  };
  /* Every field is forced to a usable type here, once, so no screen below
     ever has to guard against a null, a NaN or a missing column. */
  function clean(x) {
    x.name = s(x.name); x.manager = s(x.manager); x.city = s(x.city); x.team = s(x.team);
    x.revenue = n(x.revenue); x.units = n(x.units); x.target = n(x.target); x.agents = n(x.agents);
    return x;
  }
  out.cities.forEach(clean); out.managers.forEach(clean); out.teams.forEach(clean); out.agents.forEach(clean);
  if (out.contest.active) {
    out.contest.agents = (out.contest.agents || []).filter(function (a) { return a && a.name; });
    out.contest.agents.forEach(clean);
    out.contest.totalUnits = n(out.contest.totalUnits);
  }

  // sort everything by revenue desc, then assign rank
  function bySales(a, b) { return b.revenue - a.revenue || b.units - a.units; }
  out.cities.sort(bySales); out.managers.sort(bySales); out.agents.sort(bySales);
  out.cities.forEach(function (c, i) { c.rank = i + 1; });
  out.managers.forEach(function (m, i) { m.rank = i + 1; });
  out.agents.forEach(function (a, i) {
    a.rank = i + 1;
    var pr = a.prevRank != null ? a.prevRank : prevAgentRank[a.name];
    a.move = (pr == null) ? null : (pr - a.rank);      // +ve = climbed
  });

  // totals fall back to the sum of the parts if the API did not send them
  var t = out.totals;
  if (!n(t.revenue)) t.revenue = out.cities.reduce(function (s, c) { return s + c.revenue; }, 0);
  if (!n(t.units))   t.units   = out.cities.reduce(function (s, c) { return s + c.units; }, 0);
  if (!n(t.target))  t.target  = out.cities.reduce(function (s, c) { return s + c.target; }, 0);
  if (!n(t.agents))  t.agents  = out.cities.reduce(function (s, c) { return s + c.agents; }, 0);
  return out;
}

/* =====================================================================
   CHROME
   ===================================================================== */
function paintChrome() {
  var m = DATA.meta || {};
  document.getElementById('periodBig').textContent = m.month || '—';
  document.getElementById('periodSmall').textContent = m.windowLabel || 'month to date';
  paintLive();
}
function paintLive() {
  var live = document.getElementById('live'), txt = document.getElementById('livetext');
  if (USING_SAMPLE && !CONFIG.API_URL) { live.className = 'down'; txt.innerHTML = '<b>PREVIEW</b>'; return; }
  /* Two different clocks, deliberately. `link` is how long since a request
     succeeded - it decides whether the board is healthy. `data` is how old
     the figures themselves are - it is what gets shown, because that is the
     question anyone standing in front of a leaderboard is actually asking. */
  var link = LAST_OK ? Math.round((Date.now() - LAST_OK) / 1000) : null;
  var data = DATA_AT ? Math.round((Date.now() - DATA_AT) / 1000) : link;

  if (link == null)                  { live.className = 'down';  txt.innerHTML = 'connecting…'; }
  else if (FAILS > 0 && link > CONFIG.REFRESH_SECONDS * 3) { live.className = 'down';  txt.innerHTML = 'reconnecting &middot; data <b>' + fmtAge(data) + '</b>'; }
  else if (data > 900)                                     { live.className = 'stale'; txt.innerHTML = 'data <b>' + fmtAge(data) + '</b>'; }
  else                                                     { live.className = '';      txt.innerHTML = 'LIVE &middot; data <b>' + fmtAge(data) + '</b>'; }
}
function fmtAge(s) {
  if (s < 60) return s + 's ago';
  if (s < 3600) return Math.round(s / 60) + 'm ago';
  return Math.round(s / 3600) + 'h ago';
}
setInterval(paintLive, 1000);

/* =====================================================================
   CELEBRATIONS
   ===================================================================== */
function checkMilestone() {
  var rev = n(DATA.totals.revenue);
  var hit = 0;
  CONFIG.MILESTONES.forEach(function (m) { if (rev >= m && m > seenMilestone) hit = Math.max(hit, m); });
  if (hit && seenMilestone) flash('MILESTONE', money(hit) + ' CROSSED', money(rev) + ' and counting');
  if (hit) seenMilestone = hit;
  if (!seenMilestone) {   // first load: remember without celebrating history
    CONFIG.MILESTONES.forEach(function (m) { if (rev >= m) seenMilestone = Math.max(seenMilestone, m); });
  }
}
function flash(k, nm, v) {
  var f = document.getElementById('flash');
  document.getElementById('flashK').textContent = k;
  document.getElementById('flashN').textContent = nm;
  document.getElementById('flashV').textContent = v || '';
  f.className = 'on'; beep(880);
  setTimeout(function () { f.className = ''; }, 5200);
}
var actx = null;
function beep(hz) {
  if (!CONFIG.SOUND) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    var o = actx.createOscillator(), g = actx.createGain();
    o.type = 'sine'; o.frequency.value = hz; o.connect(g); g.connect(actx.destination);
    g.gain.setValueAtTime(0.0001, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.18, actx.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + 0.5);
    o.start(); o.stop(actx.currentTime + 0.52);
  } catch (e) {}
}

function scManagers() {

      '<div class="num lime">' + moneyShort(m.revenue) + '</div>' +

        '<div style="font-size:14px;color:var(--muted);margin-top:5px">' + attain + '</div></div>' +

      rows + '</div>';

var AGENT_WINDOW = 12;      // ask for more than can fit; autofit decides the rest
function scAgents() {
  var list = DATA.agents;
  var pods = list.slice(0, 3).map(function (x, i) {
    return '<div class="pod sm ' + ['gold', 'silver', 'bronze'][i] + '">' +
      '<div class="medal">' + medal(i) + '</div>' +
      '<div class="nm">' + esc(x.name) + ' ' + moveChip(x.move) + '</div>' +
      '<div class="meta">' + esc(joinDot(x.manager, x.city)) + '</div>' +
      '<div class="rev">' + money(x.revenue) + '</div>' +
      '<div class="u">' + plural(x.units, 'unit') + ' · avg ' + money(x.units ? x.revenue / x.units : 0) + '</div>' +
      '</div>';
  }).join('');

  /* 90 agents will not fit on one screen, so walk through them: each time
     this screen comes round it starts where the last one stopped. The cursor
     moves by however many rows actually fitted, so nobody is skipped over. */
  var rest = list.slice(3);
  agentTotal = rest.length;
  if (agentFrom >= agentTotal) agentFrom = 0;
  var slice = rest.slice(agentFrom, agentFrom + AGENT_WINDOW);

  var rows = slice.map(function (x) {
    var above = list[x.rank - 2];
    return '<div class="row" data-rank="' + x.rank + '">' +
      '<div class="rk">' + x.rank + '</div>' +
      '<div class="nm2"><span class="tx">' + esc(x.name) + '</span>' + moveChip(x.move) + '</div>' +
      '<div class="meta2">' + esc(x.manager) + '</div>' +
      '<div class="meta2">' + esc(x.city) + '</div>' +
      '<div class="num">' + x.units + '</div>' +
      '<div class="num lime">' + money(x.revenue) +
        (above ? '<div style="font-size:13px;color:var(--dim);font-family:Archivo,sans-serif">' + money(above.revenue - x.revenue) + ' to #' + (x.rank - 1) + '</div>' : '') +
      '</div></div>';
  }).join('');

  return '<div class="eyebrow" id="lbLabel">Top agents · company wide</div>' +
    '<h1 class="big">THE <span class="accent">BOARD</span></h1>' +
    '<div class="podium" style="margin-top:22px">' + pods + '</div>' +
    '<div class="lb" style="margin-top:16px" data-relabel="Top agents · company wide · ranks {from}-{to} of ' +
      list.length + '">' + rows + '</div>';
}

function plural(n2, word) { return n2 + ' ' + word + (Number(n2) === 1 ? '' : 's'); }

function scTeams() {
  var ts = DATA.teams.slice().sort(function (a, b) { return b.revenue - a.revenue; });
  if (ts.length < 2) return '<div class="center"><div class="line sm">Team split not available</div></div>';
  var lead = ts[0], chase = ts[1], gap = lead.revenue - chase.revenue;

      '<div class="t">' + esc(t.name).toUpperCase() + '</div>' +

      '<div class="bar" style="margin-top:22px"><i data-w="' + Math.min(100, a) + '"></i></div>' +
      '<div style="font-family:Anton,Archivo Black,Impact,sans-serif;font-size:40px;margin-top:12px;color:' + (win ? 'var(--lime)' : 'var(--muted)') + '">' + a.toFixed(1) + '%</div>' +
      '</div>';
  }
  return '<div class="eyebrow">Head to head</div>' +
    '<h1 class="big">INDIA <span class="accent">vs</span> INTERNATIONAL</h1>' +

    '<div style="text-align:center;font-size:26px;color:var(--muted);margin-top:22px">' +
      '<b style="color:var(--lime)">' + esc(lead.name) + '</b> leads by <b style="color:var(--white)">' + money(gap) + '</b>' +

}

function scTargetBattle() {
  function bars(items) {
    return items.map(function (x) {
      var a = pct(x.revenue, x.target);

        '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px">' +

          '<span style="font-family:Anton,Archivo Black,Impact,sans-serif;font-size:26px;color:' + (a >= 100 ? 'var(--gold)' : 'var(--lime)') + '">' + a.toFixed(1) + '%</span>' +

      '<div class="barwrap"><div class="eyebrow">By manager</div><div class="barcol">' + bars(withTarget.slice(0, 7)) + '</div></div>' +

function scAwards() {
  var A = DATA.agents, M = DATA.managers, C = DATA.cities;
  var topAgent = A[0], mover = A.slice().sort(function (a, b) { return (b.move || 0) - (a.move || 0); })[0];
  var unit = A.slice().sort(function (a, b) { return b.units - a.units; })[0];

                .sort(function (a, b) { return pct(b.revenue, b.target) - pct(a.revenue, a.target); })[0];

  var closers = A.filter(function (a) { return a.revenue > 0; }).length;

  function card(k, ic, who, v, note) {
    return '<div class="award"><div class="ic">' + ic + '</div><div><div class="k">' + k + '</div>' +
      '<div class="who">' + esc(who || '—') + '</div></div>' +
      '<div><div class="v">' + (v || '') + '</div><div class="n">' + esc(note || '') + '</div></div></div>';
  }
  return '<div class="eyebrow">Hall of fame · ' + esc(DATA.meta.windowLabel || '') + '</div>' +
    '<h1 class="big">TODAY\'S <span class="accent">HEROES</span></h1>' +
    '<div class="awards" style="margin-top:24px">' +
      card('Champion', '👑', topAgent && topAgent.name, topAgent && money(topAgent.revenue), topAgent ? joinDot(plural(topAgent.units, 'unit'), topAgent.city) : '') +
      card('Biggest mover', '🚀', mover && mover.move > 0 ? mover.name : '—', mover && mover.move > 0 ? '▲ ' + mover.move + ' places' : 'board steady', mover && mover.move > 0 ? 'now #' + mover.rank : '') +
      card('Unit crusher', '⚡', unit && unit.name, unit && plural(unit.units, 'unit'), unit ? money(unit.revenue) : '') +
      card('Target hunter', '🎯', hunter && hunter.name, hunter && pct(hunter.revenue, hunter.target).toFixed(1) + '%', hunter ? 'of ' + money(hunter.target) : '') +
      card('City champion', '🏙️', cityTop && cityTop.name, cityTop && money(cityTop.revenue), cityTop ? pct(cityTop.revenue, cityTop.target).toFixed(1) + '% of target' : '') +
      card('Manager of the day', '🧭', mgrTop && mgrTop.name, mgrTop && money(mgrTop.revenue), mgrTop ? joinDot(mgrTop.city, plural(mgrTop.units, 'unit')) : '') +
      card('Biggest ticket', '💎', avg && avg.name, avg && money(avg.revenue / avg.units), avg ? 'average deal value' : '') +
      card('On the board', '🔥', closers + ' of ' + n(DATA.totals.agents), 'have closed', 'agents with at least one sale this month') +
    '</div>';
}

/* What this agent has earned so far, straight off the ladder. */
function payout(units) {
  var L = CONFIG.LADDER;
  units = n(units);
  if (units >= L.perUnitFrom) return units * L.perUnit;
  return n(L.steps[units]);
}
/* What one more close is worth right now - the number that actually moves people. */
function nextStep(units) {
  var u = n(units) + 1;
  return Math.max(0, payout(u) - payout(units));
}

/* Below the first rung the payout is zero, and a big gold 0 on a wall reads
   as broken and kills exactly the person who most needs pushing. Show them
   the rung they are one close away from instead. */
function earnedLine(units) {
  var earned = payout(units);
  if (earned > 0) {
    return 'units &middot; <b style="color:var(--gold)">' + money(earned) + '</b> earned' +
           ' &middot; +' + money(nextStep(units)) + ' for the next';
  }
  return 'units &middot; <b style="color:var(--gold)">' + money(payout(n(units) + 1)) +
         '</b> at ' + (n(units) + 1);
}

/* The ladder, drawn from the same numbers that pay people, so the board
   can never advertise a rung the leaderboard does not actually pay. */
function ladderHtml() {
  var L = CONFIG.LADDER;
  if (!L) return '';
  var rungs = [];
  Object.keys(L.steps).sort(function (a, b) { return a - b; }).forEach(function (u) {
    rungs.push({ u: u, v: money(L.steps[u]), hot: false });
  });
  rungs.push({ u: L.perUnitFrom + '+', v: money(L.perUnit) + ' PER UNIT', hot: true });

  return '<div style="margin-top:18px">' +
    '<div style="font-size:13px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);font-weight:800;margin-bottom:10px">Payout ladder</div>' +
    '<div style="display:flex;gap:12px;flex-wrap:wrap">' +
      rungs.map(function (r) {
        return '<div style="flex:1;min-width:150px;border-radius:14px;padding:14px 18px;' +
          'border:1px solid ' + (r.hot ? 'rgba(255,215,110,.6)' : 'var(--line)') + ';' +
          'background:' + (r.hot ? 'rgba(255,215,110,.12)' : 'rgba(255,255,255,.04)') + '">' +
          '<div style="font-family:Anton,Archivo Black,Impact,sans-serif;font-size:34px;line-height:1">' + r.u + '</div>' +
          '<div style="font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:2px">units</div>' +
          '<div style="font-family:Anton,Archivo Black,Impact,sans-serif;font-size:26px;margin-top:8px;color:' +
            (r.hot ? 'var(--gold)' : 'var(--white)') + '">' + r.v + '</div>' +
        '</div>';
      }).join('') +
    '</div>' +
    (L.rules || []).map(function (t) {
      return '<div style="font-size:17px;color:var(--muted);margin-top:10px">' + esc(t) + '</div>';
    }).join('') +
  '</div>';
}

/* ---------------------------------------------------------------------
   THE SPOT BOARD - a contest gets its own screen, not a slot in a queue
   --------------------------------------------------------------------- */

/* How long is left. The window's last day is inclusive, so it runs to the
   end of that day in the viewer's own timezone - which on these TVs is IST. */
function timeLeft(C) {
  if (!C || !C.to) return null;
  var p = String(C.to).split('-');
  if (p.length !== 3) return null;
  var end = new Date(+p[0], +p[1] - 1, +p[2], 23, 59, 59);
  var ms = end.getTime() - Date.now();
  if (ms <= 0) return { over: true, label: 'CLOSED' };
  var h = Math.floor(ms / 3600000), m = Math.floor((ms % 3600000) / 60000);
  return { over: false, hours: h,
           label: h >= 1 ? (h + 'h ' + m + 'm') : (m + 'm'),
           urgent: h < 6 };
}

/* Contest units folded by whatever key you hand it - city or manager. */
function spotBy(list, key) {
  var m = {}, i, k;
  for (i = 0; i < list.length; i++) {
    k = list[i][key] || 'Unassigned';
    if (!m[k]) m[k] = { name: k, units: 0, revenue: 0, people: 0 };
    m[k].units += n(list[i].units);
    m[k].revenue += n(list[i].revenue);
    m[k].people += 1;
  }
  var out = [];
  for (k in m) out.push(m[k]);
  return out.sort(function (a, b) { return b.units - a.units || b.revenue - a.revenue; });
}

function spotPot(list) {
  return list.reduce(function (s2, a) { return s2 + payout(a.units); }, 0);
}

/* No contest running: say so plainly rather than show an empty board. */
function scSpotClosed() {
  return '<div class="center">' +
    '<div class="kicker">Spot board</div>' +
    '<div class="line">NO CONTEST <span class="accent">RUNNING</span></div>' +
    '<div class="note">Set <b>WR_CONTEST.active</b> in war-room.gs when the next one starts. ' +
    'The month board is on <b>/warroom</b>.</div></div>';
}

/* SCREEN 1 - the offer, the count, the clock, the ladder. */
function scSpotOffer() {
  var C = DATA.contest;
  if (!C || !C.active) return scSpotClosed();
  var I = CONFIG.INITIATIVE, L = CONFIG.LADDER;
  var list = C.agents || [];
  var pot = spotPot(list);
  var left = timeLeft(C);
  var onBoard = list.filter(function (a) { return a.units > 0; }).length;

  var rungs = Object.keys(L.steps).sort(function (a, b) { return a - b; }).map(function (uu) {
    return { u: uu, v: money(L.steps[uu]), hot: false };
  });
  rungs.push({ u: L.perUnitFrom + '+', v: money(L.perUnit) + ' EACH', hot: true });

  return '' +
  '<div class="eyebrow" style="color:var(--gold)">Running now &middot; ' + esc(I.period) + '</div>' +
  '<h1 class="big" style="font-size:88px;color:var(--gold)">' + esc(C.name) + '</h1>' +
  '<div class="sub" style="font-size:23px;margin-top:6px">' + esc(I.detail) + '</div>' +
  /* State the counting rule on the board, taken from the feed's own
     setting rather than typed in beside it. A contest that pays money
     should not leave anyone working out on Monday what counted. */
  '<div style="font-size:19px;color:var(--gold);margin-top:6px">' +
    (C.countMode === 'payments'
      ? 'Every payment landing in the window counts as one.'
      : 'First payment or full payment counts as one. Balances on earlier sales do not.') +
  '</div>' +

  /* The three numbers anyone actually looks up for get the height. The
     ladder is a reference strip underneath, not the main event. */
  '<div class="statrow spotstats" style="margin-top:24px;flex:1;min-height:0">' +
    '<div class="stat hero" style="flex:1.4"><div class="lbl">Units on the board</div>' +
      '<div class="val" style="font-size:196px;line-height:.95" data-count="' + n(C.totalUnits) + '" data-fmt="int">0</div></div>' +
    '<div class="stat"><div class="lbl">Earned so far</div>' +
      '<div class="val" style="color:var(--gold);font-size:88px">' + money(pot) + '</div>' +
      '<div class="foot" style="font-size:17px">' + onBoard + ' agent' + (onBoard === 1 ? '' : 's') + ' on the board</div></div>' +
    '<div class="stat"' + (left && left.urgent ? ' style="border-color:rgba(255,107,138,.55);background:rgba(255,107,138,.10)"' : '') + '>' +
      '<div class="lbl">' + (left && left.over ? 'Window' : 'Time left') + '</div>' +
      '<div class="val" style="font-size:88px' + (left && left.urgent ? ';color:var(--rose)' : '') + '">' +
        (left ? left.label : '-') + '</div>' +
      '<div class="foot" style="font-size:17px">closes ' + esc(C.to) + '</div></div>' +
  '</div>' +

  '<div class="eyebrow" style="margin:20px 0 10px">Payout ladder &middot; no cap</div>' +
  '<div style="display:flex;gap:14px;flex:none;height:168px">' +
    rungs.map(function (r) {
      return '<div style="flex:1;border-radius:18px;padding:18px 22px;display:flex;flex-direction:column;justify-content:center;' +
        'border:1px solid ' + (r.hot ? 'rgba(255,215,110,.6)' : 'var(--line)') + ';' +
        'background:' + (r.hot ? 'rgba(255,215,110,.12)' : 'rgba(255,255,255,.04)') + '">' +
        '<div style="display:flex;align-items:baseline;gap:10px">' +
          '<span style="font-family:Anton,Archivo Black,Impact,sans-serif;font-size:50px;line-height:1">' + r.u + '</span>' +
          '<span style="font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:3px">units</span>' +
        '</div>' +
        '<div style="font-family:Anton,Archivo Black,Impact,sans-serif;font-size:38px;margin-top:10px;color:' +
          (r.hot ? 'var(--gold)' : 'var(--white)') + '">' + r.v + '</div>' +
      '</div>';
    }).join('') +
  '</div>' +
  '<div style="font-size:16px;color:var(--muted);margin-top:12px">' +
    (L.rules || []).map(esc).join(' &nbsp;&middot;&nbsp; ') + '</div>';
}

/* SCREEN 2 - who is on it. */
function scSpotBoard() {
  var C = DATA.contest;
  if (!C || !C.active) return scSpotClosed();
  var list = C.agents || [];
  var left = timeLeft(C);

  if (!list.length) {

  var pods = list.slice(0, 3).map(function (x, i) {

      '<div class="medal">' + medal(i) + '</div>' +
      '<div class="nm">' + esc(x.name) + '</div>' +
      '<div class="meta">' + esc(joinDot(x.manager, x.city)) + '</div>' +
      '<div class="rev" style="font-size:78px">' + x.units + '</div>' +
      '<div class="u" style="font-size:19px">' + earnedLine(x.units) + '</div>' +

  }).join('');

  var rows = list.slice(3).map(function (x, i) {
    return '<div class="row" style="grid-template-columns:64px 1fr 180px 140px 90px 170px">' +
      '<div class="rk">' + (i + 4) + '</div>' +
      '<div class="nm2"><span class="tx">' + esc(x.name) + '</span></div>' +
      '<div class="meta2">' + esc(x.manager) + '</div>' +
      '<div class="meta2">' + esc(x.city) + '</div>' +
      '<div class="num">' + x.units + '</div>' +
      (payout(x.units) > 0
        ? '<div class="num" style="color:var(--gold)">' + money(payout(x.units)) + '</div>'
        : '<div class="meta2" style="text-align:right;font-size:15px">' +
            money(payout(x.units + 1)) + ' at ' + (x.units + 1) + '</div>') +
      '</div>';
  }).join('');

  return '<div class="eyebrow" style="color:var(--gold)">' + esc(C.name) +
      (left && !left.over ? ' &middot; ' + left.label + ' left' : '') + '</div>' +
    '<h1 class="big">WHO IS <span class="accent">CLOSING</span></h1>' +
    '<div class="podium" style="margin-top:20px">' + pods + '</div>' +
    '<div class="lb" style="margin-top:16px">' + rows + '</div>';
}

/* SCREEN 3 - where the units are coming from. */
function scSpotSplit() {
  var C = DATA.contest;
  if (!C || !C.active) return scSpotClosed();
  var list = C.agents || [];
  var byCity = spotBy(list, 'city'), byMgr = spotBy(list, 'manager');
  var top = Math.max(1, byCity.length ? byCity[0].units : 1);
  var topM = Math.max(1, byMgr.length ? byMgr[0].units : 1);

  function bars(items, max) {
    if (!items.length) return '<div class="note" style="font-size:20px">Nothing yet.</div>';
    return items.slice(0, 7).map(function (x) {
      return '<div>' +
        '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px">' +
          '<span style="font-size:25px;font-weight:700">' + esc(x.name) + '</span>' +
          '<span><span style="font-family:Anton,Archivo Black,Impact,sans-serif;font-size:30px">' + x.units + '</span>' +
          '<span style="font-size:15px;color:var(--muted)"> units &middot; ' + money(spotPot([x])) + '</span></span>' +
        '</div>' +
        '<div class="bar"><i data-w="' + Math.round(x.units / max * 100) + '"></i></div>' +
      '</div>';
    }).join('');
  }

  return '<div class="eyebrow" style="color:var(--gold)">' + esc(C.name) + ' &middot; where it is coming from</div>' +
    '<h1 class="big">THE <span class="accent">SPLIT</span></h1>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:48px;margin-top:26px;flex:1;min-height:0">' +
      '<div class="barwrap"><div class="eyebrow">By city</div>' +
        '<div class="barcol">' + bars(byCity, top) + '</div></div>' +
      '<div class="barwrap"><div class="eyebrow">By manager</div>' +
        '<div class="barcol">' + bars(byMgr, topM) + '</div></div>' +
    '</div>';
}

function scContest() {
  var C = DATA.contest;
  if (!C || !C.active) return scAgents();
  var list = C.agents || [];
  var pot = list.reduce(function (s2, a) { return s2 + payout(a.units); }, 0);

  var pods = list.slice(0, 3).map(function (x, i) {
    return '<div class="pod ' + ['gold', 'silver', 'bronze'][i] + '">' +
      '<div class="medal">' + medal(i) + '</div>' +
      '<div class="nm">' + esc(x.name) + '</div>' +
      '<div class="meta">' + esc(joinDot(x.manager, x.city)) + '</div>' +
      '<div class="rev" style="font-size:66px">' + x.units + '</div>' +
      '<div class="u" style="font-size:18px">' + earnedLine(x.units) + '</div>' +
      '</div>';
  }).join('') ||
    '<div class="pod" style="grid-column:1/-1"><div class="nm">NOBODY HAS OPENED THE BOARD YET</div>' +
    '<div class="meta" style="margin-top:8px">First unit takes the top spot.</div></div>';

  var rows = list.slice(3).map(function (x, i) {
    return '<div class="row" style="grid-template-columns:64px 1fr 170px 130px 90px 150px">' +
      '<div class="rk">' + (i + 4) + '</div>' +
      '<div class="nm2"><span class="tx">' + esc(x.name) + '</span></div>' +
      '<div class="meta2">' + esc(x.manager) + '</div>' +
      '<div class="meta2">' + esc(x.city) + '</div>' +
      '<div class="num">' + x.units + '</div>' +
      (payout(x.units) > 0
        ? '<div class="num" style="color:var(--gold)">' + money(payout(x.units)) + '</div>'
        : '<div class="meta2" style="text-align:right;font-size:15px">' +
            money(payout(x.units + 1)) + ' at ' + (x.units + 1) + '</div>') +
      '</div>';
  }).join('');

  var warn = C.programmeColumnMissing
    ? '<div style="font-size:15px;color:var(--rose);margin-top:10px">Counting every unit - ' +
      'the model has no programme column, so the Accelerator-only rule is being judged by hand.</div>'
    : '';

  return '<div class="eyebrow" style="color:var(--gold)">' + esc(C.name) + ' &middot; ' +
      esc(CONFIG.INITIATIVE.period) + '</div>' +
    '<div style="display:flex;align-items:baseline;gap:36px">' +
      '<h1 class="big">UNITS <span class="accent">ON THE BOARD</span></h1>' +
      '<div style="font-family:Anton,Archivo Black,Impact,sans-serif;font-size:112px;line-height:1;color:var(--gold)"' +
        ' data-count="' + n(C.totalUnits) + '" data-fmt="int">0</div>' +
      '<div style="font-size:20px;color:var(--muted)">' + money(pot) + ' earned so far</div>' +
    '</div>' + warn +
    '<div class="podium" style="margin-top:18px">' + pods + '</div>' +
    '<div class="lb" style="margin-top:14px">' + rows + '</div>';
}

function scInitiative() {
  var I = CONFIG.INITIATIVE;
  var prog = I.goalRevenue > 0 ? Math.min(100, pct(DATA.totals.revenue, I.goalRevenue)) : null;
  return '<div class="eyebrow">Running now</div>' +
    '<div class="offer">' +
      '<div class="t">🔥 ' + esc(I.title) + '</div>' +
      '<div class="d">' + esc(I.detail) + '</div>' +
      '<div class="grid">' +
        '<div class="cell"><div class="k">Who</div><div class="v">' + esc(I.eligibility) + '</div></div>' +
        '<div class="cell"><div class="k">When</div><div class="v">' + esc(I.period) + '</div></div>' +
        '<div class="cell"><div class="k">Reward</div><div class="v">' + esc(I.reward) + '</div></div>' +
      '</div>' +
      (prog == null ? '' :
        '<div style="margin-top:16px"><div class="bar gold"><i data-w="' + prog + '"></i></div>' +
        '<div style="font-size:20px;color:var(--muted);margin-top:10px">' + money(DATA.totals.revenue) + ' of ' + money(I.goalRevenue) + ' · ' + prog.toFixed(1) + '%</div></div>') +
      ladderHtml() +
    '</div>';
}

/* creative interstitials, generated from the real numbers */
function scInterstitial() {
  var cards = [], C = DATA.cities, A = DATA.agents, M = DATA.managers, T = DATA.totals;

  var avgDeal = n(T.units) > 0 ? n(T.revenue) / n(T.units) : 0;
  if (C.length > 1 && C[0].revenue > C[1].revenue) {
    var gap = C[0].revenue - C[1].revenue;
    cards.push({ k: 'City battle',
                 line: esc(C[0].name) + ' leads ' + esc(C[1].name) + ' by <span class="accent">' + money(gap) + '</span>',
                 note: avgDeal > 0
                   ? 'About ' + Math.max(1, Math.ceil(gap / avgDeal)) + ' closes would put ' + esc(C[1].name) + ' back on top.'
                   : esc(C[1].name) + ' is one good day from closing that.' });
  }
  var next = CONFIG.MILESTONES.filter(function (m) { return m > n(T.revenue); })[0];
  if (next) cards.push({ k: 'Next milestone', line: '<span class="accent">' + money(next - T.revenue) + '</span> to cross ' + money(next),
                         note: 'Company is at ' + money(T.revenue) + ' with ' + (n(DATA.meta.days) - n(DATA.meta.day)) + ' days left.' });
  if (A.length > 3) cards.push({ k: 'The chase', line: esc(A[1].name) + ' is <span class="accent">' + money(A[0].revenue - A[1].revenue) + '</span> from #1',
                                 note: 'One good close changes the top of the board.' });
  if (A.length) cards.push({ k: 'Call to action', line: 'WHO TAKES <span class="accent">#1</span> NEXT?',
                             note: 'Current leader ' + esc(A[0].name) + ' at ' + money(A[0].revenue) + '.' });
  if (M.length > 1) cards.push({ k: 'Manager race', line: esc(M[1].name) + ' is <span class="accent">' + money(M[0].revenue - M[1].revenue) + '</span> behind ' + esc(M[0].name),
                                 note: 'The manager board can flip today.' });
  var rate = n(T.units) && n(DATA.meta.day) ? (n(T.units) / n(DATA.meta.day)) : 0;
  if (rate) cards.push({ k: 'Fun fact', line: 'The floor is closing <span class="accent">' + rate.toFixed(1) + ' units</span> a day',
                         note: 'At this pace September lands near ' + money(T.revenue / Math.max(1, n(DATA.meta.day)) * n(DATA.meta.days)) + '.' });
  cards.push({ k: 'Sales wisdom', line: 'THE SALE IS <span class="accent">NEVER</span> LOST ON PRICE.',
               note: 'It is lost on the conversation before it.' });
  cards.push({ k: 'Sales wisdom', line: 'EVERY <span class="accent">NO</span> IS DATA. EVERY YES IS PROOF.',
               note: 'Keep dialling.' });

  var c = cards[((interIdx % cards.length) + cards.length) % cards.length];
  return '<div class="center">' +
    '<div class="kicker">' + esc(c.k) + '</div>' +
    '<div class="line">' + c.line + '</div>' +
    '<div class="note">' + c.note + '</div>' +
  '</div>';
}

/* =====================================================================
   ROTATION ENGINE
   ===================================================================== */
function activeScreens() {
  return CONFIG.SCREENS.filter(function (s) {
    if (s === 'initiative') return CONFIG.INITIATIVE && CONFIG.INITIATIVE.active;
    if (s.indexOf('city:') === 0) {
      var nm = s.slice(5);
      return DATA && DATA.cities.some(function (c) { return c.name === nm; });
    }
    if (s === 'teams') return DATA && DATA.teams.length > 1;
    if (s === 'contest') return !!(DATA && DATA.contest && DATA.contest.active);
    /* The spot screens stay in rotation even with no contest running - one of
       them then says so, which beats a board that silently shows nothing. */
    if (s.indexOf('spot') === 0) return true;
    return true;
  });
}

function buildScreen(key) {
  if (key === 'spotoffer') return { name: 'The offer', html: scSpotOffer() };
  if (key === 'spotboard') return { name: 'Live board', html: scSpotBoard() };
  if (key === 'spotsplit') return { name: 'The split', html: scSpotSplit() };
  if (key === 'contest') return { name: (DATA.contest && DATA.contest.name) || 'Contest', html: scContest() };
  if (key === 'overall') return { name: 'Company championship', html: scOverall() };
  if (key.indexOf('city:') === 0) { var c = key.slice(5); return { name: c + ' leaderboard', html: scCity(c) }; }
  if (key === 'managers') return { name: 'Manager leaderboard', html: scManagers() };
  if (key === 'agents') return { name: 'Agent leaderboard', html: scAgents() };
  if (key === 'teams') return { name: 'India vs International', html: scTeams() };
  if (key === 'targetbattle') return { name: 'Target battle', html: scTargetBattle() };
  if (key === 'awards') return { name: 'Hall of fame', html: scAwards() };
  if (key === 'initiative') return { name: 'Current initiative', html: scInitiative() };
  if (key === 'interstitial') return { name: '', html: scInterstitial() };
  return { name: '', html: '<div class="center"><div class="line sm">—</div></div>' };
}

function render() {
  if (!DATA) return;
  var list = activeScreens();
  if (!list.length) return;
  var pos = ((screenIdx % list.length) + list.length) % list.length;   // safe for negatives
  var key = list[pos];
  var built = buildScreen(key);

  var host = document.getElementById('screens');
  host.innerHTML = '';
  var sc = document.createElement('div');
  sc.className = 'screen';
  sc.innerHTML = built.html;
  host.appendChild(sc);
  // force reflow then reveal, so the transition actually plays
  void sc.offsetWidth;
  sc.classList.add('on');

  autofit(sc);
  if (key === 'agents') relabel(sc);

  document.getElementById('screenname').textContent = built.name || '';
  paintDots(list.length, pos);

  // animate bars + count-ups now that the nodes are in the DOM
  requestAnimationFrame(function () {
    sc.querySelectorAll('.bar > i').forEach(function (b) { b.style.width = (b.getAttribute('data-w') || 0) + '%'; });
    sc.querySelectorAll('[data-count]').forEach(function (node) {
      var to = Number(node.getAttribute('data-count')) || 0, f = node.getAttribute('data-fmt');
      var fmt = f === 'money' ? money : f === 'pct1' ? function (v) { return v.toFixed(1) + '%'; }
              : f === 'int' ? function (v) { return Math.round(v).toLocaleString('en-IN'); } : money;
      countUp(node, to, fmt, 1000);
    });
  });
}

/* A TV must never scroll and must never clip. Leaderboards are the only
   thing whose length we do not control - 9 managers today, 14 next quarter.
   So after laying a screen out, drop rows off the bottom until it fits and
   say how many were dropped. Nothing is ever silently cut off screen. */
function autofit(sc) {
  var lb = sc.querySelector('.lb');
  if (!lb) return;
  function over() {
    return (lb.scrollHeight > lb.clientHeight + 1) || (sc.scrollHeight > sc.clientHeight + 1);
  }
  var dropped = 0, guard = 0;
  while (over() && lb.children.length > 1 && guard++ < 300) {
    lb.removeChild(lb.lastElementChild); dropped++;
  }
  // A paged board says which ranks it is showing, so it needs no "+N more".
  if (lb.hasAttribute('data-relabel')) return;
  if (!dropped) return;

  // one more row buys the space for the "+N more" line
  if (lb.children.length > 1) { lb.removeChild(lb.lastElementChild); dropped++; }
  var more = document.createElement('div');
  more.className = 'more';
  more.textContent = '+ ' + dropped + ' more not shown';
  lb.appendChild(more);
  while (over() && lb.children.length > 2 && guard++ < 300) {
    lb.removeChild(lb.children[lb.children.length - 2]); dropped++;
    more.textContent = '+ ' + dropped + ' more not shown';
  }
}

/* After trimming, say exactly which ranks survived. The header must never
   promise a name that is not on the screen. */
function relabel(sc) {
  var lb = sc.querySelector('.lb[data-relabel]');
  var lab = sc.querySelector('#lbLabel');
  var rows = lb ? lb.querySelectorAll('.row[data-rank]') : [];
  agentShown = rows.length;
  if (!lb || !lab || !rows.length) return;
  lab.textContent = lb.getAttribute('data-relabel')
    .replace('{from}', rows[0].getAttribute('data-rank'))
    .replace('{to}', rows[rows.length - 1].getAttribute('data-rank'));
}

function paintDots(total, idx) {
  var d = document.getElementById('dots');
  if (d.children.length !== total) {
    d.innerHTML = ''; for (var i = 0; i < total; i++) d.appendChild(document.createElement('i'));
  }
  for (var j = 0; j < d.children.length; j++) d.children[j].className = (j === idx ? 'on' : '');
}

function next() { screenIdx++; show(); }

/* show = paint the current screen and schedule the one after it.
   Kept separate from next() so boot can display screen 0 rather than
   skipping straight past it. */
function show() {
  var list = activeScreens();
  var key = list[((screenIdx % list.length) + list.length) % list.length];

  /* Advance the paged screens once per arrival. A data refresh repaints the
     same screen and must NOT flip the page under the floor's eyes. */
  if (key === 'agents' && agentShown > 0) {
    agentFrom += agentShown;
    if (agentFrom >= agentTotal) agentFrom = 0;   // back to the top of the list
  }
  if (key === 'interstitial') interIdx++;

  render();
  var secs = (key === 'interstitial') ? CONFIG.INTERSTITIAL_SECONDS : CONFIG.ROTATE_SECONDS;
  runProgress(secs);
  clearTimeout(rotTimer);
  rotTimer = setTimeout(next, secs * 1000);
}

function runProgress(secs) {
  var bar = document.getElementById('progress');
  clearInterval(progTimer);
  var t0 = Date.now();
  bar.style.width = '0%';
  progTimer = setInterval(function () {
    var p = Math.min(100, ((Date.now() - t0) / (secs * 1000)) * 100);
    bar.style.width = p + '%';
    if (p >= 100) clearInterval(progTimer);
  }, 100);
}

/* =====================================================================
   BOOT
   ===================================================================== */
/* Say which of the two boards this screen is, so nobody has to guess. */
document.getElementById('boardName').textContent =
  (BOARD === 'spot') ? 'Spot Offer Board' : 'Sales War Room';

fit();
if (Q.get('demo') === '1') {
  /* Layout preview only, for checking a TV before the feed exists.
     Never reached in normal use - a board with no feed says so instead. */
  applyData(SAMPLE, true);
  screenIdx = 0;
  show();
} else {
  stateScreen(CONFIG.API_URL ? 'unreachable' : 'not-configured');
}
loadData();
setInterval(loadData, Math.max(10, CONFIG.REFRESH_SECONDS) * 1000);

/* A long-running TV tab can have its timers throttled when backgrounded.
   When it becomes visible again, re-sync immediately rather than waiting. */
/* The fullscreen button only exists for the person setting the TV up. */
var fsHide = null;
document.addEventListener('mousemove', function () {
  var b = document.getElementById('fsbtn');
  b.className = 'show';
  clearTimeout(fsHide);
  fsHide = setTimeout(function () { b.className = ''; }, 3000);
});

document.addEventListener('visibilitychange', function () {
  if (!document.hidden) { loadData(); fit(); }
});

/* Belt and braces for 24/7: a nightly reload clears any browser cruft. */
setInterval(function () {
  var h = new Date().getHours(), m = new Date().getMinutes();
  if (h === 4 && m === 0) location.reload();
}, 60000);
</script>
